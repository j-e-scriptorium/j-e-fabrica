<script>
/* ══════════════════════════════════════════════════════════════════════════
   EVERY WORD THE PLAYER READS
   ─────────────────────────────────────────────────────────────────────────
   This is the only place in the file where user-facing text lives.
   Edit freely. Two rules:
     · Keep the {braces} — the game fills them in with numbers.
     · Keep the five band names in order, oldest first.
   Per-item text — prompts, subtitles, reveals — lives in the corpus, not here.
   ══════════════════════════════════════════════════════════════════════════ */
const COPY = {

  /* ---- masthead --------------------------------------------------------- */
  title:        "Strata",
  tagline:      "ancient history",

  score:        "Score",

  /* ---- map -------------------------------------------------------------- */
  mapBefore:    "Click the map to drop a pin.",
  mapAfter:     "Pin dropped. Click again to move it.",
  mapCredit:    "Coastlines: Natural Earth",

  /* ---- timeline --------------------------------------------------------- */
  bands:        ["Before the cities", "Bronze Age", "Iron Age", "Classical", "Rome"],
  bc:           "BC",
  ad:           "AD",
  timeHint:     "Drag the layers, or type the year for an exact answer.",

  /* ---- how the points are split -----------------------------------------
     Shown before the player answers, so they know whether the date is
     something that can be pinned down. Matched on how wide the answer
     window is, narrowest first; the last entry catches everything else.  */
  precisionLabels: [
    { upTo: 5,    text: "dated to the year" },
    { upTo: 30,   text: "dated to the decade" },
    { upTo: 90,   text: "dated to a reign or lifetime" },
    { upTo: 250,  text: "dated to about a century" },
    { upTo: 600,  text: "dated to a few centuries" },
    { upTo: null, text: "known only as a long era" }
  ],
  splitTip:     "how the points are split",
  splitTime:    "time",
  splitPlace:   "place",

  /* ---- buttons ---------------------------------------------------------- */
  submit:       "Submit guess",
  next:         "Next round",
  lastRound:    "See final score",
  playAgain:    "Play again",

  /* ---- the answer screen ------------------------------------------------ */
  scorePlace:   "Place",
  scoreTime:    "Time",
  scoreRound:   "Round",
  placeInRange: "Within range.",
  placeMiss:    "{km} km too far to the {dir}.",
  timeInRange:  "Within range.",
  timeEarly:    "{years} yr too early.",
  timeLate:     "{years} yr too late.",
  ptsOfMax:     "{score} of {max} pts",
  outOfMax:     "of {max}",
  tagChapter:   "Chapter {n}",
  tagBasis:     "{basis} date",
  tagConf:      "confidence: {level}",

  /* ---- end of game ------------------------------------------------------ */
  finalHeading: "Final score",
  finalOutOf:   "of {max}",
  finalBest:    "Best",
  finalHardest: "Hardest",
  finalLine:    "<b>{bestLabel}:</b> {best} — {bestScore}. <b>{hardestLabel}:</b> {hardest} — {hardestScore}."
};

/* ---- knobs that are not words ------------------------------------------- */
const SETTINGS = {
  roundsPerGame:  10,
  pointsPerRound: 5000,
  includeTierC:   false,   // enrichment items that are not in the book
  startYear:      -1000    // where the slider sits at the start of a round
};
</script>

<style>
:root{
  --paper:#F2EDE0;--paper-2:#E7E0CE;--ink:#221E19;--ink-3:#6E655A;--rule:#C9BFA8;
  --l1:#7A7060;--l2:#8A5F35;--l3:#9C7A2E;--l4:#6E7A46;--l5:#3E6E63;
  --patina:#2F6357;--sienna:#8A4B24;--shadow:0 1px 0 rgba(34,30,25,.14);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
.mono{font-family:'Space Mono',monospace}
.wrap{max-width:1120px;margin:0 auto;padding:14px 16px 30px}
.backlink{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink-3);text-decoration:none;display:inline-block;margin-top:10px}
.backlink:hover{color:var(--ink)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
  border-bottom:1.5px solid var(--ink);padding-bottom:9px;margin-bottom:14px}
.brand{font-family:'Zilla Slab',serif;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand span{font-family:'Space Mono',monospace;font-size:10px;font-weight:400;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-3);margin-left:9px}
.hstat{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.hstat b{color:var(--ink);font-size:14px;letter-spacing:0}
.prompt{border:1.5px solid var(--ink);background:var(--paper-2);padding:13px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.prompt .kicker{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--patina);margin-bottom:5px}
.prompt h2{font-family:'Zilla Slab',serif;font-size:clamp(21px,3.6vw,30px);font-weight:700;
  margin:0 0 5px;letter-spacing:-.015em;line-height:1.12}
.precision{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:7px 0 8px}
.precision .pl{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink);border:1px solid var(--ink);padding:2px 7px;background:var(--paper)}
.precision .pbar{width:120px;height:7px;border:1px solid var(--ink);background:#B9AE94;display:inline-block;position:relative}
.precision .pbar i{position:absolute;left:0;top:0;bottom:0;background:var(--patina)}
.precision .pn{font-family:'Space Mono',monospace;font-size:10px;color:var(--ink-3)}
.prompt p{margin:0;font-size:14px;line-height:1.48;color:var(--ink-3);max-width:76ch}
#map{height:min(46vh,420px);min-height:260px;border:1.5px solid var(--ink);box-shadow:var(--shadow);background:#C7D6D3}
.maphint{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--ink-3);margin:5px 0 12px;
  display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.readout{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:7px}
.year{font-family:'Zilla Slab',serif;font-weight:700;font-size:clamp(34px,6.4vw,50px);line-height:1;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.year .era{font-size:.42em;font-weight:600;color:var(--ink-3);margin-left:.12em}
.entry{display:flex;align-items:center;gap:5px;border:1.5px solid var(--ink);background:var(--paper);
  padding:5px 9px;box-shadow:var(--shadow)}
.entry input{width:66px;border:0;background:transparent;text-align:right;font-weight:700;outline:none;
  font-family:'Space Mono',monospace;font-size:13px;color:var(--ink)}
.entry select{font-family:'Space Mono',monospace;font-size:13px;border:0;background:transparent;outline:none;cursor:pointer}
.nudge{font-family:'Space Mono',monospace;font-size:13px;background:var(--paper);border:1.5px solid var(--ink);
  padding:6px 10px;cursor:pointer;box-shadow:var(--shadow);color:var(--ink)}
.nudge:hover{background:var(--paper-2)} .nudge:active{transform:translateY(1px);box-shadow:none}
.eralab{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--patina)}
.strata{position:relative;height:66px;display:flex;border:1.5px solid var(--ink);cursor:ew-resize;
  touch-action:none;overflow:hidden;box-shadow:var(--shadow)}
.strata:focus-visible{outline:2.5px solid var(--patina);outline-offset:3px}
.band{position:relative;height:100%;border-right:1px solid rgba(34,30,25,.34)}
.band:last-child{border-right:0}
.band .fill{position:absolute;inset:0}
.bandlabel{position:absolute;left:6px;bottom:5px;font-family:'Space Mono',monospace;font-size:8.5px;
  letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.92);pointer-events:none;
  text-shadow:0 1px 2px rgba(0,0,0,.45)}
.handle{position:absolute;top:-8px;bottom:-8px;width:2px;background:var(--ink);transform:translateX(-1px);pointer-events:none}
.handle::before,.handle::after{content:"";position:absolute;left:50%;width:12px;height:12px;
  background:var(--sienna);border:1.5px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.handle::before{top:-1px} .handle::after{bottom:-1px}
.ansband{position:absolute;top:0;bottom:0;background:rgba(47,99,87,.36);
  border-left:2px solid var(--patina);border-right:2px solid var(--patina);pointer-events:none;display:none}
.axis{position:relative;height:20px;margin-bottom:12px}
.tick{position:absolute;top:0;transform:translateX(-50%)}
.tick i{display:block;width:1px;height:5px;background:var(--ink-3);margin:0 auto 3px}
.tick span{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--ink-3);white-space:nowrap}
.actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cta{font-family:'Space Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.09em;
  text-transform:uppercase;background:var(--patina);color:#F2EDE0;border:1.5px solid var(--ink);
  padding:12px 26px;cursor:pointer;box-shadow:var(--shadow)}
.cta:hover{background:#26514a} .cta:active{transform:translateY(1px);box-shadow:none}
.cta[disabled]{background:var(--paper-2);color:var(--ink-3);cursor:not-allowed;box-shadow:none}
.sheet{position:fixed;inset:0;background:rgba(34,30,25,.5);display:none;align-items:flex-end;
  justify-content:center;z-index:1000}
.sheet.on{display:flex}
.card{background:var(--paper);border-top:2px solid var(--ink);width:100%;max-width:1120px;
  max-height:88vh;overflow:auto;padding:20px 22px 24px}
.scorerow{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;align-items:end;
  border-bottom:1.5px solid var(--ink);padding-bottom:12px;margin-bottom:14px}
.sc .lab{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.sc .val{font-family:'Zilla Slab',serif;font-size:27px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.sc .val.txt{font-family:Archivo,system-ui,sans-serif;font-size:16px;font-weight:600;line-height:1.3;letter-spacing:0}
.sc .sub{font-size:11.5px;color:var(--ink-3);font-family:'Space Mono',monospace}
.sc.total .val{color:var(--patina);font-size:33px}
.perfect{color:var(--patina)}
.card h3{font-family:'Zilla Slab',serif;font-size:20px;margin:0 0 3px;font-weight:700}
.answerline{font-family:'Space Mono',monospace;font-size:11.5px;color:var(--ink-3);margin-bottom:12px}
.reveal{font-size:14.5px;line-height:1.62;max-width:74ch;margin:0 0 18px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.tag{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;
  border:1px solid var(--rule);padding:3px 7px;color:var(--ink-3)}
.final{text-align:center;padding:8px 0 4px}
.final .lab{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.final .big{font-family:'Zilla Slab',serif;font-size:56px;font-weight:700;color:var(--patina);line-height:1}
.breakdown{margin:16px 0;border-top:1px solid var(--rule)}
.brow{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule);
  font-size:13px;align-items:baseline}
.brow .n{font-family:'Space Mono',monospace;font-size:12px;color:var(--ink-3)}
@media(max-width:640px){
  #map{height:38vh}
  .scorerow{grid-template-columns:1fr 1fr}
  .sc.total{grid-column:1/-1;border-top:1px solid var(--rule);padding-top:9px}
}
</style>
</head>

<div class="wrap">
<a class="backlink" href="../index.html">&larr; the Fabrica</a>
<header>
  <div class="brand" id="brand"></div>
  <div class="hstat" id="hstat"></div>
</header>

<div class="prompt">
  <div class="kicker" id="kicker"></div>
  <h2 id="pTitle">—</h2>
  <div class="precision" id="precision"></div>
  <p id="pSub"></p>
</div>

<div id="map"></div>
<div class="maphint"><span id="mapMsg"></span><span id="mapCredit"></span></div>

<div class="readout">
  <div class="year" id="yearOut"></div>
  <div class="eralab" id="eraName"></div>
  <div style="flex:1"></div>
  <button class="nudge" id="dec10">−10</button>
  <button class="nudge" id="dec1">−1</button>

</div>

     aria-valuemin="-9000" aria-valuemax="500" aria-valuenow="-1000">

  <div class="handle" id="handle"></div>
</div>
<div class="axis" id="axis"></div>

<div class="actions">
  <button class="cta" id="submit" disabled></button>
  <span class="mono" id="timeHint" style="font-size:11px;color:var(--ink-3)"></span>
</div>
</div>

<div class="sheet" id="sheet"><div class="card" id="card"></div></div>

<script>
const ITEMS = [{"id":"c01-jericho-walls","chapter":1,"tier":"A","category":"structure","difficulty":4,"prompt":"The stone walls of Jericho","subtitle":"A wall and a solid stone tower with an internal staircase, built by people who had no metal and no pottery.","place":{"shape":"circle","lat":31.87,"lon":35.44,"radiusKm":60,"label":"Jericho, the Jordan valley"},"time":{"start":-8300,"end":-6800,"timeBasis":"construction","label":"Pre-Pottery Neolithic Jericho"},"lambdaYears":800,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"Radiocarbon puts the tower nearer 8000 BC than the book's 6800. Whether the wall was defensive or a flood barrier is disputed. The same site turns up again five thousand years later, in chapter 15.","timeMax":1400,"placeMax":3600},{"id":"c01-nomads","chapter":1,"tier":"A","category":"people-group","difficulty":4,"prompt":"The first nomads of the Fertile Crescent","subtitle":"Following the herds and the ripening grain, carrying everything, and staying nowhere.","place":{"shape":"polygon","label":"The Fertile Crescent, from the Levant round to the Gulf","points":[[37.5,36.0],[37.0,44.0],[33.0,47.5],[30.5,47.5],[31.0,44.0],[31.5,35.0],[33.5,35.5],[36.0,36.5]]},"time":{"start":-9000,"end":-6000,"timeBasis":"floruit","label":"Before settled farming took hold"},"lambdaYears":800,"lambdaKm":800,"dateBasis":"archaeological","confidence":"medium","reveal":"The shift from following food to growing it is the largest change in the whole book, and it happened here first — wheat, barley, sheep, goats, pigs, and cattle were all domesticated within this arc.","timeMax":1400,"placeMax":3600},{"id":"c01-sahara-drying","chapter":1,"tier":"B","category":"event","difficulty":5,"prompt":"The drying of the Green Sahara","subtitle":"Rock paintings of swimmers, hippos, and cattle herds, in a place where it now never rains.","place":{"shape":"circle","lat":22.0,"lon":12.0,"radiusKm":900,"label":"The central Sahara"},"time":{"start":-4000,"end":-2500,"timeBasis":"event-year","label":"Desiccation of the African Humid Period"},"lambdaYears":500,"lambdaKm":1200,"dateBasis":"archaeological","confidence":"medium","reveal":"The desert forming is why the Nile valley filled with people and why West Africa developed largely on its own.","timeMax":1400,"placeMax":3600},{"id":"c02-hierakonpolis","chapter":2,"tier":"B","category":"city","difficulty":3,"prompt":"Hierakonpolis (Nekhen)","subtitle":"City of the falcon god, seat of the kings of the valley before there was one Egypt.","place":{"shape":"circle","lat":25.1,"lon":32.77,"radiusKm":60,"label":"Hierakonpolis"},"time":{"start":-3800,"end":-2900,"timeBasis":"floruit","label":"Predynastic and Early Dynastic floruit"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"The largest urban site of predynastic Upper Egypt, with the oldest known Egyptian tomb painting and the earliest known zoo.","timeMax":1400,"placeMax":3600},{"id":"c02-horus","chapter":2,"tier":"B","category":"deity-or-myth","difficulty":4,"prompt":"Horus","subtitle":"The falcon who avenged his murdered father, lost an eye doing it, and whose living image every pharaoh claimed to be.","place":{"shape":"circle","lat":25.05,"lon":32.82,"radiusKm":200,"label":"Nekhen and Edfu, upper Egypt"},"time":{"start":-3100,"end":-300,"timeBasis":"attestation","label":"Worshipped throughout the dynastic period"},"lambdaYears":350,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"The reigning king was Horus and the dead king was Osiris, so every succession re-enacted the myth. The wedjat, the healed eye, is the commonest amulet in Egypt.","timeMax":1400,"placeMax":3600},{"id":"c02-memphis","chapter":2,"tier":"A","category":"city","difficulty":2,"prompt":"Memphis","subtitle":"The White Walls, capital where the valley opens into the delta.","place":{"shape":"circle","lat":29.85,"lon":31.25,"radiusKm":60,"label":"Memphis"},"time":{"start":-3100,"end":-640,"timeBasis":"occupation","label":"Capital from unification to the Late Period"},"lambdaYears":200,"lambdaKm":400,"dateBasis":"conventional","confidence":"high","reveal":"The site sits near modern Mit Rahina, about 20 km south of Cairo. It stayed inhabited long after it stopped being the capital.","timeMax":1900,"placeMax":3100},{"id":"c02-narmer","chapter":2,"tier":"A","category":"ruler","difficulty":2,"prompt":"Narmer (Menes)","subtitle":"The king remembered as the first to wear both crowns.","place":{"shape":"circle","lat":29.85,"lon":31.25,"radiusKm":250,"label":"Memphis and the lower Nile valley"},"time":{"start":-3120,"end":-3000,"timeBasis":"reign","label":"Reign of Narmer"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"Egyptologists debate whether Narmer and the legendary Menes are the same man. Absolute dates this early rest on king-list arithmetic and radiocarbon, not on any dated document — treat 3100 BC as a marker, not a measurement.","timeMax":2300,"placeMax":2700},{"id":"c02-narmer-palette","chapter":2,"tier":"B","category":"object","difficulty":3,"prompt":"The Narmer Palette","subtitle":"A slab of green stone showing a king clubbing an enemy, and the same king wearing the other crown on the reverse.","place":{"shape":"circle","lat":25.1,"lon":32.77,"radiusKm":100,"label":"Hierakonpolis (Nekhen)"},"time":{"start":-3120,"end":-3080,"timeBasis":"construction","label":"c. 3100 BC"},"lambdaYears":150,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"Found in 1898 in the temple deposit at Hierakonpolis, 500 km up the Nile from Memphis — worth noting that where an object was made, used, and buried are three different questions.","timeMax":1750,"placeMax":3250},{"id":"c02-osiris-isis","chapter":2,"tier":"B","category":"deity-or-myth","difficulty":2,"prompt":"Osiris and Isis","subtitle":"A murdered king becomes lord of the dead; his wife gathers the pieces.","place":{"shape":"circle","lat":26.18,"lon":31.92,"radiusKm":400,"label":"Abydos, chief cult centre"},"time":{"start":-2400,"end":-300,"timeBasis":"attestation","label":"First attested in the Pyramid Texts; worshipped for two millennia after"},"lambdaYears":250,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"The full narrative we know best comes from Plutarch, writing in Greek around AD 100 — nearly 2,500 years after the earliest Egyptian references. The window here is deliberately wide because a living cult has no single date.","timeMax":1400,"placeMax":3600},{"id":"c02-ra","chapter":2,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"Ra","subtitle":"The sun, sailing a boat across the sky by day and through the underworld by night, fighting a serpent on the way.","place":{"shape":"circle","lat":30.13,"lon":31.29,"radiusKm":150,"label":"Heliopolis, at the head of the delta"},"time":{"start":-2600,"end":-300,"timeBasis":"attestation","label":"From the Old Kingdom solar cult onward"},"lambdaYears":350,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Heliopolis is a Greek name — sun city. The obelisks that now stand in London, Paris, and New York were quarried for its temples.","timeMax":1400,"placeMax":3600},{"id":"c02-unification","chapter":2,"tier":"A","category":"event","difficulty":2,"prompt":"Upper and Lower Egypt become one kingdom","subtitle":"The white crown of the valley and the red crown of the delta are joined.","place":{"shape":"circle","lat":29.85,"lon":31.25,"radiusKm":300,"label":"Memphis, at the junction of valley and delta"},"time":{"start":-3150,"end":-3000,"timeBasis":"event-year","label":"c. 3100 BC"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"Unification was probably a process over generations rather than a single conquest; the Narmer Palette compresses it into one image.","timeMax":2250,"placeMax":2750},{"id":"c03-cuneiform","chapter":3,"tier":"A","category":"idea","difficulty":2,"prompt":"Cuneiform","subtitle":"Wedges pressed into wet clay with a cut reed — the world's first writing.","place":{"shape":"circle","lat":31.32,"lon":45.64,"radiusKm":200,"label":"Uruk, southern Sumer"},"time":{"start":-3400,"end":-3100,"timeBasis":"event-year","label":"Earliest tablets"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"It began as accounting — tallies of grain, beer, and sheep. Literature comes almost a thousand years later.","timeMax":1400,"placeMax":3600},{"id":"c03-hieroglyphs","chapter":3,"tier":"A","category":"idea","difficulty":2,"prompt":"Egyptian hieroglyphs","subtitle":"Sacred carvings: pictures that stand for sounds as well as things.","place":{"shape":"circle","lat":26.18,"lon":31.92,"radiusKm":300,"label":"Abydos and the Upper Nile"},"time":{"start":-3300,"end":-3100,"timeBasis":"event-year","label":"Earliest known use"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"The oldest examples are bone and ivory labels from tomb U-j at Abydos. Whether Egyptian writing was invented independently or prompted by news of Mesopotamian writing is still argued.","timeMax":1450,"placeMax":3550},{"id":"c03-rosetta-stone","chapter":3,"tier":"B","category":"object","difficulty":3,"prompt":"The Rosetta Stone","subtitle":"One decree in three scripts — the key that reopened hieroglyphs.","place":{"shape":"circle","lat":31.4,"lon":30.42,"radiusKm":80,"label":"Rosetta (Rashid), Nile delta"},"time":{"start":-196,"end":-196,"timeBasis":"event-year","label":"196 BC"},"lambdaYears":60,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"Carved for Ptolemy V, found by French soldiers in 1799, deciphered by Champollion in 1822. Note the trap: it is a Rosetta-era object about a much older script.","timeMax":3100,"placeMax":1900},{"id":"c03-sumerians","chapter":3,"tier":"A","category":"people-group","difficulty":2,"prompt":"The Sumerians","subtitle":"The black-headed people of the marshes between two rivers.","place":{"shape":"polygon","label":"Southern Mesopotamia","points":[[33.4,44.0],[33.0,46.2],[30.5,47.6],[30.2,46.0],[31.4,44.4]]},"time":{"start":-4500,"end":-1900,"timeBasis":"floruit","label":"From the first cities to absorption into Babylonia"},"lambdaYears":250,"lambdaKm":700,"dateBasis":"archaeological","confidence":"high","reveal":"Sumerian is a language isolate — related to nothing else known. It survived as a written liturgical language long after nobody spoke it, rather like Latin.","timeMax":1400,"placeMax":3600},{"id":"c03-uruk","chapter":3,"tier":"B","category":"city","difficulty":3,"prompt":"Uruk","subtitle":"Arguably the first city on earth, and later the city Gilgamesh was said to rule.","place":{"shape":"circle","lat":31.32,"lon":45.64,"radiusKm":60,"label":"Uruk (Warka)"},"time":{"start":-4000,"end":-2900,"timeBasis":"floruit","label":"Uruk period floruit"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"At its height it may have held 40,000 people inside six miles of wall. The site is now dry desert; the Euphrates has moved.","timeMax":1400,"placeMax":3600},{"id":"c04-anubis","chapter":4,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"Anubis","subtitle":"The jackal who guards the cemetery and weighs the heart against a feather.","place":{"shape":"circle","lat":29.87,"lon":31.22,"radiusKm":200,"label":"Saqqara and the desert cemeteries"},"time":{"start":-2900,"end":-300,"timeBasis":"attestation","label":"Throughout the dynastic period"},"lambdaYears":350,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Jackals really did scavenge in desert graveyards, so the god who protected the dead was given the shape of the animal that threatened them.","timeMax":1400,"placeMax":3600},{"id":"c04-canopic-jars","chapter":4,"tier":"B","category":"object","difficulty":5,"prompt":"Canopic jars","subtitle":"Four stoppered jars for the liver, lungs, stomach, and intestines — and nothing at all for the brain.","place":{"shape":"circle","lat":27.8,"lon":31.3,"radiusKm":400,"label":"Egypt"},"time":{"start":-2600,"end":-300,"timeBasis":"attestation","label":"Old Kingdom through the Ptolemies"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"archaeological","confidence":"high","reveal":"The heart stayed in the body because it was thought to do the thinking. The brain was pulled out through the nose and thrown away.","timeMax":1400,"placeMax":3600},{"id":"c04-djoser","chapter":4,"tier":"B","category":"ruler","difficulty":3,"prompt":"Pharaoh Djoser","subtitle":"The king who wanted a tomb no one had built before.","place":{"shape":"circle","lat":29.87,"lon":31.22,"radiusKm":100,"label":"Saqqara and Memphis"},"time":{"start":-2670,"end":-2640,"timeBasis":"reign","label":"Reign of Djoser"},"lambdaYears":120,"lambdaKm":500,"dateBasis":"conventional","confidence":"medium","reveal":"Later Egyptians remembered his reign as the moment stone architecture began.","timeMax":2500,"placeMax":2500},{"id":"c04-great-pyramid","chapter":4,"tier":"A","category":"structure","difficulty":2,"prompt":"The Great Pyramid of Giza","subtitle":"2.3 million blocks, aligned to true north, tallest building on earth for 3,800 years.","place":{"shape":"circle","lat":29.98,"lon":31.13,"radiusKm":40,"label":"Giza plateau"},"time":{"start":-2580,"end":-2550,"timeBasis":"construction","label":"Built under Khufu"},"lambdaYears":120,"lambdaKm":400,"dateBasis":"conventional","confidence":"medium","reveal":"Papyri found at Wadi al-Jarf in 2013 record a work gang hauling limestone for the casing — the only firsthand documents from the construction.","timeMax":2500,"placeMax":2500},{"id":"c04-imhotep","chapter":4,"tier":"B","category":"person","difficulty":3,"prompt":"Imhotep","subtitle":"Architect, physician, and vizier — later worshipped as a god.","place":{"shape":"circle","lat":29.87,"lon":31.22,"radiusKm":100,"label":"Saq ly Dynastic and Old Kingdom"},"lambdaYears":250,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Stack six of them smallest on top and you have the Step Pyramid — which is more or less how Djoser's architect got there.","timeMax":1400,"placeMax":3600},{"id":"c04-mummification","chapter":4,"tier":"A","category":"idea","difficulty":2,"prompt":"Egyptian mummification","subtitle":"Seventy days of natron, linen, and canopic jars — the brain discarded, the heart left in place.","place":{"shape":"circle","lat":27.8,"lon":31.3,"radiusKm":450,"label":"Egypt"},"time":{"start":-2600,"end":-1100,"timeBasis":"floruit","label":"Old Kingdom through New Kingdom, at its most elaborate"},"lambdaYears":250,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"Deliberate embalming goes back further than this window and continued into Roman Egypt; the range marks the classic period. Earlier Egyptians relied on the desert sand to do the work.","timeMax":1400,"placeMax":3600},{"id":"c04-old-kingdom","chapter":4,"tier":"A","category":"empire-or-dynasty","difficulty":2,"prompt":"The Old Kingdom of Egypt","subtitle":"The age of pyramid-building, ended by drought and a collapse of royal power.","place":{"shape":"circle","lat":29.0,"lon":31.3,"radiusKm":450,"label":"Egypt, ruled from Memphis"},"time":{"start":-3000,"end":-2100,"timeBasis":"dynasty-span","label":"Third through Sixth Dynasties"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"These boundary dates are conventional; different Egyptologists shift them by up to a century. The end coincides with a severe arid episode across the eastern Mediterranean.","timeMax":1800,"placeMax":3200},{"id":"c04-step-pyramid","chapter":4,"tier":"A","category":"structure","difficulty":3,"prompt":"The Step Pyramid of Djoser","subtitle":"Six stone platforms stacked smallest on top — the first pyramid.","place":{"shape":"circle","lat":29.87,"lon":31.22,"radiusKm":40,"label":"Saqqara"},"time":{"start":-2670,"end":-2640,"timeBasis":"construction","label":"Built during Djoser's reign"},"lambdaYears":120,"lambdaKm":400,"dateBasis":"conventional","confidence":"medium","reveal":"It began as a flat mastaba tomb and was enlarged upward at least five times — the design evolved during construction.","timeMax":2500,"placeMax":2500},{"id":"c05-akkad-city","chapter":5,"tier":"C","category":"city","difficulty":4,"prompt":"The city of Akkad (Agade)","subtitle":"Sargon's capital, which gave its name to an empire and a language — and has never been found.","place":{"shape":"circle","lat":33.2,"lon":44.4,"radiusKm":220,"label":"Somewhere on the Euphrates near modern Baghdad"},"time":{"start":-2334,"end":-2100,"timeBasis":"occupation","label":"Capital under the Akkadian dynasty"},"lambdaYears":200,"lambdaKm":900,"dateBasis":"conventional","confidence":"low","reveal":"This is the rare item where nobody knows the answer. Its location is inferred from travel times in texts. Consider scoring it generously or using it as a teaching item rather than a scored round.","timeMax":1850,"placeMax":3150},{"id":"c05-akkadian-empire","chapter":5,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The Akkadian Empire","subtitle":"The first state to rule Sumer, Akkad, and the lands beyond as one.","place":{"shape":"polygon","label":"Mesopotamia from the Gulf toward the Levant","points":[[36.8,38.5],[37.2,43.5],[34.5,45.5],[30.3,47.8],[30.5,45.8],[33.5,43.0],[34.5,39.0]]},"time":{"start":-2334,"end":-2154,"timeBasis":"dynasty-span","label":"Sargon to the fall to the Gutians"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"It lasted under two centuries. Its collapse is often linked to a sharp drought episode around 2200 BC visible in sediment cores across the region.","timeMax":2200,"placeMax":2800},{"id":"c05-enheduanna","chapter":5,"tier":"C","category":"person","difficulty":4,"prompt":"Enheduanna","subtitle":"Sargon's daughter, high priestess of the moon god, and the first author in history to sign her name.","place":{"shape":"circle","lat":30.96,"lon":46.1,"radiusKm":80,"label":"Ur"},"time":{"start":-2285,"end":-2250,"timeBasis":"floruit","label":"Active as high priestess"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Her hymns to Inanna survive in copies made centuries later. A few scholars doubt the attribution; most accept it.","timeMax":2450,"placeMax":2550},{"id":"c05-gutians","chapter":5,"tier":"B","category":"people-group","difficulty":5,"prompt":"The Gutians","subtitle":"Mountain people out of the Zagros who finished off the Akkadian empire, and whom Sumerian scribes called a people who know no restraint.","place":{"shape":"circle","lat":34.5,"lon":45.8,"radiusKm":300,"label":"The Zagros mountains and central Mesopotamia"},"time":{"start":-2154,"end":-2050,"timeBasis":"dynasty-span","label":"Gutian ascendancy"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"conventional","confidence":"low","reveal":"Everything written about them was written by people they conquered, so the picture is unflattering and thin. Drought did at least as much damage to Akkad as they did.","timeMax":2100,"placeMax":2900},{"id":"c05-kish","chapter":5,"tier":"B","category":"city","difficulty":4,"prompt":"Kish","subtitle":"The city whose king Sargon served as cupbearer before he served nobody.","place":{"shape":"circle","lat":32.54,"lon":44.6,"radiusKm":60,"label":"Kish (Tell al-Uhaymir)"},"time":{"start":-3100,"end":-1900,"timeBasis":"floruit","label":"Early Dynastic through Old Babylonian"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"In the Sumerian King List, Kish is where kingship descends from heaven after the flood. 'King of Kish' became a title claimed by rulers who had never been there.","timeMax":1400,"placeMax":3600},{"id":"c05-naram-sin","chapter":5,"tier":"C","category":"ruler","difficulty":4,"prompt":"Naram-Sin","subtitle":"Sargon's grandson, the first Mesopotamian king to call himself a god.","place":{"shape":"circle","lat":33.0,"lon":44.4,"radiusKm":220,"label":"Akkad"},"time":{"start":-2254,"end":-2218,"timeBasis":"reign","label":"Reign of Naram-Sin"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"His victory stele shows him climbing a mountain over the bodies of his enemies, wearing the horned helmet of divinity. The Elamites carried it off to Susa a thousand years later.","timeMax":2450,"placeMax":2550},{"id":"c05-sargon","chapter":5,"tier":"A","category":"ruler","difficulty":2,"prompt":"Sargon of Akkad","subtitle":"A cupbearer's son, set adrift in a reed basket, who took the throne and then took everything else.","place":{"shape":"circle","lat":32.9,"lon":44.4,"radiusKm":200,"label":"Akkad, central Mesopotamia"},"time":{"start":-2334,"end":-2279,"timeBasis":"reign","label":"Reign of Sargon"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Middle chronology. The basket story survives in a text written over a thousand years after he lived, and is told of Moses too — a shared Near Eastern motif, not a borrowing in either direction that we can prove.","timeMax":2450,"placeMax":2550},{"id":"c05-ur","chapter":5,"tier":"A","category":"city","difficulty":3,"prompt":"Ur","subtitle":"Great ziggurat, royal tombs full of harps and headdresses, and the city Abraham left.","place":{"shape":"circle","lat":30.96,"lon":46.1,"radiusKm":60,"label":"Ur (Tell el-Muqayyar)"},"time":{"start":-3800,"end":-500,"timeBasis":"occupation","label":"Occupied; at its height 2112-2004 BC"},"lambdaYears":250,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Whether this Ur is the 'Ur of the Chaldees' of Genesis is contested — some argue for a northern Ur near Harran, which would make Abraham's journey much shorter.","timeMax":1400,"placeMax":3600},{"id":"c06-abraham","chapter":6,"tier":"A","category":"person","difficulty":2,"prompt":"Abraham","subtitle":"Told to leave his country for a land he would be shown.","place":{"shape":"multipoint","label":"Ur, Harran, and Canaan","radiusKm":150,"points":[[30.96,46.1],[36.86,39.03],[31.53,35.1]]},"time":{"start":-1980,"end":-1805,"timeBasis":"lifespan","label":"Traditional lifespan"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"These dates are curricular convention, derived from adding up biblical genealogies; there is no external evidence for Abraham. Scholars who accept a historical patriarch generally place him in the Middle Bronze Age, roughly 2000-1500 BC. Multipoint scoring means credit for Ur, Harran, or Hebron.","timeMax":1550,"placeMax":3450},{"id":"c06-call-of-abraham","chapter":6,"tier":"A","category":"event","difficulty":3,"prompt":"Abraham leaves Ur","subtitle":"A family packs up and walks northwest along the Euphrates.","place":{"shape":"circle","lat":30.96,"lon":46.1,"radiusKm":120,"label":"Ur"},"time":{"start":-1910,"end":-1900,"timeBasis":"event-year","label":"Traditional date"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Traditional chronology. Genesis says he was 75 when he left Harran, the second leg of the journey.","timeMax":1850,"placeMax":3150},{"id":"c06-descent-into-egypt","chapter":6,"tier":"A","category":"event","difficulty":4,"prompt":"Jacob's family goes down to Egypt","subtitle":"Seventy people leave a famine in Canaan for grain and pasture in the delta, and stay for centuries.","place":{"shape":"multipoint","label":"From Canaan to Goshen in the eastern delta","radiusKm":180,"points":[[31.53,35.1],[30.6,31.5]]},"time":{"start":-1695,"end":-1685,"timeBasis":"event-year","label":"Kitchen scheme: 430 years before the Exodus"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"This lands in the late Middle Kingdom, exactly when the eastern delta was filling up with Levantine settlers — the population that becomes the Hyksos in chapter 13. It is the strongest external support the patriarchal narrative has, and it falls out of the chronology rather than being argued for.","timeMax":1850,"placeMax":3150},{"id":"c06-haran","chapter":6,"tier":"B","category":"city","difficulty":4,"prompt":"Harran","subtitle":"A caravan town on the road between the rivers and the sea, where Abraham's father stopped and stayed.","place":{"shape":"circle","lat":36.86,"lon":39.03,"radiusKm":60,"label":"Harran, southern Turkey"},"time":{"start":-2000,"end":-600,"timeBasis":"floruit","label":"Bronze and Iron Age floruit"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"A major centre of moon-god worship — the same deity whose priestess Enheduanna was at Ur, at the other end of the same road.","timeMax":1400,"placeMax":3600},{"id":"c06-isaac","chapter":6,"tier":"B","category":"person","difficulty":3,"prompt":"Isaac","subtitle":"The son promised to a hundred-year-old man, and nearly given back.","place":{"shape":"circle","lat":31.4,"lon":34.9,"radiusKm":120,"label":"Canaan: Beersheba and Hebron"},"time":{"start":-1880,"end":-1700,"timeBasis":"lifespan","label":"Traditional lifespan"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"traditional","confidence":"low","reveal":"Traditional chronology from biblical genealogy.","timeMax":1550,"placeMax":3450},{"id":"c06-jacob","chapter":6,"tier":"A","category":"person","difficulty":3,"prompt":"Jacob (Israel)","subtitle":"Bought a birthright with lentil stew, wrestled all night, and got a new name out of it.","place":{"shape":"circle","lat":32.0,"lon":35.3,"radiusKm":200,"label":"Canaan and Harran"},"time":{"start":-1820,"end":-1673,"timeBasis":"lifespan","label":"Traditional lifespan"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"traditional","confidence":"low","reveal":"Traditional chronology. His twelve sons give their names to the tribes — the hinge on which the rest of the Hebrew Bible turns.","timeMax":1600,"placeMax":3400},{"id":"c06-joseph","chapter":6,"tier":"A","category":"person","difficulty":3,"prompt":"Joseph","subtitle":"Sold by his brothers, jailed on a lie, and made second in Egypt for reading a dream about cows.","place":{"shape":"multipoint","label":"Canaan and Lower Egypt","radiusKm":150,"points":[[32.2,35.3],[30.6,31.5]]},"time":{"start":-1729,"end":-1619,"timeBasis":"lifespan","label":"Traditional lifespan"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Traditional chronology. No Egyptian record names Joseph, but the picture of a Semitic official rising in the Egyptian court fits the Second Intermediate Period, when Semitic-speaking Hyksos rulers held the delta.","timeMax":1700,"placeMax":3300},{"id":"c06-joseph-vizier","chapter":6,"tier":"B","category":"event","difficulty":4,"prompt":"Joseph made governor over Egypt","subtitle":"Seven fat years to store grain against seven lean ones.","place":{"shape":"circle","lat":30.6,"lon":31.5,"radiusKm":200,"label":"The Egyptian delta"},"time":{"start":-1699,"end":-1689,"timeBasis":"event-year","label":"Traditional date"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Traditional chronology. Which pharaoh, if any, is meant is unresolved — the text calls him only 'Pharaoh'.","timeMax":1850,"placeMax":3150},{"id":"c06-sarai","chapter":6,"tier":"B","category":"person","difficulty":4,"prompt":"Sarai (Sarah)","subtitle":"Childless into old age, she laughed at the promise of a son and then had one.","place":{"shape":"multipoint","label":"Ur, Harran, and Hebron","radiusKm":150,"points":[[30.96,46.1],[36.86,39.03],[31.53,35.1]]},"time":{"start":-1970,"end":-1843,"timeBasis":"lifespan","label":"Traditional 127-year lifespan, Kitchen scheme"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Both names change at the covenant
