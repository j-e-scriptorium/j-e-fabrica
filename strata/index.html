high","reveal":"Middle chronology. The short chronology puts the reign at 1728-1686 BC and the long chronology at 1848-1806 BC — a 140-year spread, resting on Venus observations recorded in a tablet from this reign.","timeMax":2550,"placeMax":2450},{"id":"c07-marduk","chapter":7,"tier":"B","category":"deity-or-myth","difficulty":4,"prompt":"Marduk","subtitle":"A local city god promoted to king of the gods when his city was promoted too.","place":{"shape":"circle","lat":32.54,"lon":44.42,"radiusKm":200,"label":"Babylon"},"time":{"start":-1800,"end":-300,"timeBasis":"attestation","label":"From Hammurabi's elevation of the cult to the Hellenistic period"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"The clearest ancient case of theology following politics: as Babylon rose, so did its god, and the creation epic Enuma Elish was rewritten to make him the hero.","timeMax":1400,"placeMax":3600},{"id":"c07-old-babylonian-empire","chapter":7,"tier":"B","category":"empire-or-dynasty","difficulty":3,"prompt":"The Old Babylonian Empire","subtitle":"Hammurabi's dynasty, which outlived him by a century and a half and then fell to raiders from the north.","place":{"shape":"polygon","label":"Southern and central Mesopotamia","points":[[34.5,43.0],[34.8,45.5],[30.4,47.6],[30.3,45.5],[32.5,43.4]]},"time":{"start":-1894,"end":-1595,"timeBasis":"dynasty-span","label":"First Dynasty of Babylon"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"It ended when a Hittite army raided down the Euphrates from Anatolia, sacked Babylon, and went home.","timeMax":2000,"placeMax":3000},{"id":"c07-sexagesimal-time","chapter":7,"tier":"B","category":"idea","difficulty":4,"prompt":"Dividing the hour into sixty minutes","subtitle":"Counting by sixties, from people who watched the sky for a living.","place":{"shape":"circle","lat":32.0,"lon":45.0,"radiusKm":300,"label":"Mesopotamia"},"time":{"start":-2000,"end":-500,"timeBasis":"floruit","label":"Babylonian sexagesimal astronomy"},"lambdaYears":350,"lambdaKm":800,"dateBasis":"archaeological","confidence":"medium","reveal":"Base-60 counting is older than Babylon — it goes back to Sumer. Every time a clock or a compass is read, this system is in use.","timeMax":1400,"placeMax":3600},{"id":"c08-ashur","chapter":8,"tier":"A","category":"city","difficulty":3,"prompt":"Ashur","subtitle":"A city, a god, and a people, all wearing the same name.","place":{"shape":"circle","lat":35.46,"lon":43.26,"radiusKm":60,"label":"Ashur (Qal'at Sherqat), on the Tigris"},"time":{"start":-2600,"end":-614,"timeBasis":"occupation","label":"Occupied until destroyed by the Medes"},"lambdaYears":250,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"It stayed the religious capital even after the political capital moved north to Nimrud and then Nineveh. Nobody in Assyria could be crowned anywhere else.","timeMax":1400,"placeMax":3600},{"id":"c08-enkidu","chapter":8,"tier":"B","category":"person","difficulty":5,"prompt":"Enkidu","subtitle":"Made from clay to be the king's equal, he lives with the animals until a woman civilises him, and then the animals will not have him back.","place":{"shape":"circle","lat":31.32,"lon":45.64,"radiusKm":200,"label":"Uruk and the steppe beyond it"},"time":{"start":-2800,"end":-2600,"timeBasis":"floruit","label":"The setting of the story"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"traditional","confidence":"low","reveal":"His death is what sends Gilgamesh looking for immortality — the epic is really about grief. Literature's first friendship and first bereavement, four thousand years ago.","timeMax":1500,"placeMax":3500},{"id":"c08-gilgamesh","chapter":8,"tier":"A","category":"person","difficulty":3,"prompt":"Gilgamesh","subtitle":"Two parts god and one part man, king of a walled city, and very bad at accepting death.","place":{"shape":"circle","lat":31.32,"lon":45.64,"radiusKm":150,"label":"Uruk"},"time":{"start":-2800,"end":-2600,"timeBasis":"reign","label":"Traditional reign in the Sumerian King List"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"traditional","confidence":"low","reveal":"A king of Uruk by that name probably existed — an inscription of a contemporary ruler mentions him — but everything interesting about him is legend. The King List gives him a reign of 126 years.","timeMax":1500,"placeMax":3500},{"id":"c08-gilgamesh-poems","chapter":8,"tier":"A","category":"text","difficulty":5,"prompt":"The Sumerian Gilgamesh poems","subtitle":"Five separate short tales about a king of Uruk — the cedar forest, the bull of heaven, the death — with no single story joining them.","place":{"shape":"multipoint","label":"Nippur and the Sumerian scribal schools","radiusKm":150,"points":[[32.13,45.23],[31.32,45.64],[30.96,46.1]]},"time":{"start":-2150,"end":-1900,"timeBasis":"construction","label":"Composed and copied in Sumerian"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"These are the oldest layer, roughly 4,000 years old, and they are not yet an epic — they are separate poems about the same hero, copied out by trainee scribes as writing exercises. Most surviving copies come from the schoolrooms of Nippur.","timeMax":1400,"placeMax":3600},{"id":"c08-ishtar","chapter":8,"tier":"B","category":"deity-or-myth","difficulty":5,"prompt":"Ishtar","subtitle":"Goddess of love and of war at once, and of the planet Venus — Gilgamesh refuses to marry her and lists what happened to the others.","place":{"shape":"circle","lat":31.32,"lon":45.64,"radiusKm":300,"label":"The Eanna temple at Uruk"},"time":{"start":-3000,"end":-300,"timeBasis":"attestation","label":"From Sumerian Inanna to the Hellenistic period"},"lambdaYears":350,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"Sumerian Inanna, Akkadian Ishtar, Canaanite Astarte, and probably an ancestor of the Greek Aphrodite — the same goddess travelling west across three thousand years.","timeMax":1400,"placeMax":3600},{"id":"c08-kanesh","chapter":8,"tier":"C","category":"city","difficulty":5,"prompt":"The Assyrian merchant colony at Kanesh","subtitle":"A donkey caravan of tin and cloth left Ashur; forty days later it arrived here, and somebody wrote it all down.","place":{"shape":"circle","lat":38.85,"lon":35.63,"radiusKm":80,"label":"Kanesh (Kültepe), central Anatolia"},"time":{"start":-1950,"end":-1750,"timeBasis":"floruit","label":"Height of the Old Assyrian trade network"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"Over 20,000 clay tablets survive from the merchants' houses here — invoices, contracts, and letters home from wives complaining about money. It is the best-documented commercial economy of the Bronze Age.","timeMax":1550,"placeMax":3450},{"id":"c08-mari","chapter":8,"tier":"B","category":"city","difficulty":5,"prompt":"Mari","subtitle":"A palace of 300 rooms on the middle Euphrates, and an archive its conqueror forgot to burn.","place":{"shape":"circle","lat":34.55,"lon":40.89,"radiusKm":60,"label":"Mari (Tell Hariri), eastern Syria"},"time":{"start":-2900,"end":-1759,"timeBasis":"occupation","label":"Until destroyed by Hammurabi"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Shamshi-Adad took it and installed his son; Zimri-Lim took it back; Hammurabi razed it. The 25,000 tablets left in the ruins are the main reason we can date any of this.","timeMax":1400,"placeMax":3600},{"id":"c08-old-assyrian-kingdom","chapter":8,"tier":"B","category":"empire-or-dynasty","difficulty":4,"prompt":"The Old Assyrian kingdom","subtitle":"Assyria's first turn at empire — traders first, conquerors second.","place":{"shape":"polygon","label":"Northern Mesopotamia","points":[[37.5,39.5],[37.5,44.0],[35.0,44.5],[34.0,41.0],[35.5,38.5]]},"time":{"start":-2025,"end":-1750,"timeBasis":"dynasty-span","label":"Old Assyrian period, ending with Hammurabi's ascendancy"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"The Old Assyrian period is usually stretched to about 1360 BC, but the kingdom's independent power collapses after Shamshi-Adad; this window marks the era of real Assyrian initiative.","timeMax":2050,"placeMax":2950},{"id":"c08-shamshi-adad","chapter":8,"tier":"A","category":"ruler","difficulty":3,"prompt":"Shamshi-Adad I","subtitle":"An exiled prince who came back, took the north, and styled himself King of the Whole World.","place":{"shape":"circle","lat":36.5,"lon":42.0,"radiusKm":250,"label":"Upper Mesopotamia, ruled from Shubat-Enlil"},"time":{"start":-1808,"end":-1776,"timeBasis":"reign","label":"Reign of Shamshi-Adad I"},"lambdaYears":100,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Middle chronology. He was Hammurabi's older contemporary and rival; Babylon paid him deference until he died, after which Hammurabi took the north for himself. The title 'king of the whole world' was inherited boilerplate from Sargon, not a description.","timeMax":2500,"placeMax":2500},{"id":"c08-standard-epic","chapter":8,"tier":"A","category":"text","difficulty":4,"prompt":"The Epic of Gilgamesh","subtitle":"The old tales rewritten as one poem on twelve tablets, framed around a friend's death and the refusal to accept it.","place":{"shape":"circle","lat":32.8,"lon":44.3,"radiusKm":300,"label":"Babylonia"},"time":{"start":-1300,"end":-1100,"timeBasis":"construction","label":"The standard Babylonian version"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"Babylonian tradition credits the compilation to a scribe named Sin-leqi-unninni — one of the earliest named editors in history. This is the version with the flood story and the search for immortality, and it is about eight hundred years younger than the Sumerian poems it is built from. The copy we actually read was dug out of Ashurbanipal's library at Nineveh, later still.","timeMax":2150,"placeMax":2850},{"id":"c08-utnapishtim","chapter":8,"tier":"A","category":"deity-or-myth","difficulty":5,"prompt":"Utnapishtim","subtitle":"Warned by a god to pull down his house and build a boat, he survives the flood and releases a dove, a swallow, and a raven.","place":{"shape":"circle","lat":31.78,"lon":45.51,"radiusKm":250,"label":"Shuruppak, his city in the story"},"time":{"start":-1800,"end":-600,"timeBasis":"attestation","label":"Attested in Akkadian flood narratives"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"When George Smith read this tablet at the British Museum in 1872 and realised it was a flood story older than Genesis, it caused a public sensation. What the parallel means — common source, shared memory, or borrowing — has been argued ever since, and the argument is worth having honestly.","timeMax":1400,"placeMax":3600},{"id":"c09-great-bath","chapter":9,"tier":"B","category":"structure","difficulty":5,"prompt":"The Great Bath at Mohenjo-daro","subtitle":"A watertight brick tank forty feet long, sealed with tar, on the highest ground in the city.","place":{"shape":"circle","lat":27.33,"lon":68.14,"radiusKm":40,"label":"Mohenjo-daro citadel"},"time":{"start":-2500,"end":-2400,"timeBasis":"construction","label":"Built early in the city's life"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Almost certainly ritual rather than recreational, but that is inference from the effort and the placement — there is no text to tell us.","timeMax":1650,"placeMax":3350},{"id":"c09-harappa","chapter":9,"tier":"A","category":"city","difficulty":4,"prompt":"Harappa","subtitle":"The first of these cities to be dug up, and so the one that named the whole civilization.","place":{"shape":"circle","lat":30.63,"lon":72.86,"radiusKm":60,"label":"Harappa, Punjab, Pakistan"},"time":{"start":-2600,"end":-1900,"timeBasis":"occupation","label":"Mature phase occupation"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"British engineers building the Lahore–Multan railway in the 1850s carted off the ancient bricks for ballast. Roughly a hundred miles of track sit on Harappa.","timeMax":1400,"placeMax":3600},{"id":"c09-indus-civilization","chapter":9,"tier":"A","category":"people-group","difficulty":3,"prompt":"The Indus Valley civilization","subtitle":"Grid-planned cities with brick drains, standard weights, and no palaces or royal tombs anyone has found.","place":{"shape":"polygon","label":"The Indus basin and northwest India","points":[[33.0,70.5],[32.5,76.0],[28.0,76.5],[22.0,72.0],[24.0,67.0],[28.5,66.5]]},"time":{"start":-2600,"end":-1750,"timeBasis":"floruit","label":"Mature Harappan phase"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"archaeological","confidence":"high","reveal":"Larger in area than Egypt and Mesopotamia combined, and almost entirely unknown until 1921. The absence of monumental royal display is real and unexplained, not a gap in excavation.","timeMax":1400,"placeMax":3600},{"id":"c09-indus-decline","chapter":9,"tier":"A","category":"event","difficulty":4,"prompt":"The abandonment of the Indus cities","subtitle":"The drains stop being cleaned, the weights stop matching, and people drift east.","place":{"shape":"circle","lat":27.5,"lon":69.5,"radiusKm":450,"label":"The Indus basin"},"time":{"start":-1900,"end":-1700,"timeBasis":"event-year","label":"Decline of the mature phase"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"archaeological","confidence":"medium","reveal":"The old story of an Aryan invasion destroying the cities is no longer credited — there is no destruction layer. The leading explanations are the drying of the Ghaggar-Hakra river system and a weakening monsoon.","timeMax":1450,"placeMax":3550},{"id":"c09-indus-script","chapter":9,"tier":"A","category":"idea","difficulty":4,"prompt":"The Indus script","subtitle":"Four hundred signs, mostly on stamp seals, mostly in strings of five, and still unread.","place":{"shape":"circle","lat":27.5,"lon":69.5,"radiusKm":500,"label":"Across the Indus civilization"},"time":{"start":-2600,"end":-1900,"timeBasis":"attestation","label":"Period of use"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"archaeological","confidence":"high","reveal":"No bilingual text has ever been found, which is why this is not the Rosetta Stone story. A serious minority argue the signs are not writing at all but non-linguistic symbols.","timeMax":1400,"placeMax":3600},{"id":"c09-lothal","chapter":9,"tier":"C","category":"city","difficulty":5,"prompt":"Lothal","subtitle":"A port town with what may be the world's oldest dock, and a bead factory.","place":{"shape":"circle","lat":22.52,"lon":72.25,"radiusKm":60,"label":"Lothal, Gujarat, India"},"time":{"start":-2400,"end":-1900,"timeBasis":"occupation","label":"Occupation of the port"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Harappan seals turn up in Mesopotamia and Mesopotamian goods in the Indus; Lothal is where the two worlds touched. Whether the great brick basin is a dock or a reservoir is disputed.","timeMax":1400,"placeMax":3600},{"id":"c09-mohenjo-daro","chapter":9,"tier":"A","category":"city","difficulty":3,"prompt":"Mohenjo-daro","subtitle":"The Mound of the Dead — a city of 40,000 with covered sewers, abandoned without a battle.","place":{"shape":"circle","lat":27.33,"lon":68.14,"radiusKm":60,"label":"Mohenjo-daro, Sindh, Pakistan"},"time":{"start":-2500,"end":-1900,"timeBasis":"occupation","label":"Occupation of the city"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"The name is modern Sindhi; nobody knows what its inhabitants called it. Every house had a bathroom connected to a street drain, which is more than can be said for Rome.","timeMax":1400,"placeMax":3600},{"id":"c10-lei-zu","chapter":10,"tier":"A","category":"person","difficulty":4,"prompt":"Lei Zu and the silkworm","subtitle":"An empress drinking tea under a mulberry tree when a cocoon falls into her cup and starts to unwind.","place":{"shape":"circle","lat":34.5,"lon":110.2,"radiusKm":350,"label":"The Yellow River valley"},"time":{"start":-2700,"end":-2600,"timeBasis":"floruit","label":"Traditional date, as consort of the Yellow Emperor"},"lambdaYears":250,"lambdaKm":900,"dateBasis":"traditional","confidence":"low","reveal":"Legend, recorded long after the fact and dated by Chinese tradition rather than by evidence. The archaeology of silk is older than the legend.","timeMax":1700,"placeMax":3300},{"id":"c10-oracle-bones","chapter":10,"tier":"A","category":"object","difficulty":4,"prompt":"Oracle bones","subtitle":"Ox shoulder blades and turtle shells, drilled, heated until they crack, and the answer read off the cracks.","place":{"shape":"circle","lat":36.12,"lon":114.31,"radiusKm":100,"label":"Anyang (Yinxu), late Shang capital"},"time":{"start":-1250,"end":-1046,"timeBasis":"attestation","label":"Late Shang, from the reign of Wu Ding"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"archaeological","confidence":"high","reveal":"Rediscovered in 1899 when a scholar noticed the 'dragon bones' sold as medicine in Beijing pharmacies were covered in archaic writing. This is the direct ancestor of modern Chinese characters — the only one of the world's first scripts still in use.","timeMax":1550,"placeMax":3450},{"id":"c10-shang","chapter":10,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The Shang dynasty","subtitle":"Bronze vessels, chariots, human sacrifice, and kings who asked the future questions in writing.","place":{"shape":"polygon","label":"The North China Plain","points":[[38.0,112.5],[38.5,117.5],[34.5,118.5],[33.0,113.5],[34.5,110.5]]},"time":{"start":-1766,"end":-1046,"timeBasis":"dynasty-span","label":"Shang dynasty"},"lambdaYears":150,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"The end date of 1046 BC rests on a reconstructed astronomical record of the Zhou conquest and is disputed by up to a century. Unlike the Xia, the Shang is confirmed by its own written records.","timeMax":1800,"placeMax":3200},{"id":"c10-shang-bronzes","chapter":10,"tier":"B","category":"object","difficulty":5,"prompt":"Shang ritual bronzes","subtitle":"Wine vessels and cauldrons cast in piece-moulds, covered in a staring animal face nobody can name.","place":{"shape":"circle","lat":35.5,"lon":114.0,"radiusKm":350,"label":"The Shang heartland"},"time":{"start":-1500,"end":-1046,"timeBasis":"floruit","label":"Height of Shang bronze casting"},"lambdaYears":150,"lambdaKm":800,"dateBasis":"archaeological","confidence":"high","reveal":"Chinese founders used ceramic piece-moulds rather than the lost-wax method used everywhere else, which is why the decoration is so sharp and so geometric. The tomb of Lady Fu Hao held 200 of them.","timeMax":1400,"placeMax":3600},{"id":"c10-silk","chapter":10,"tier":"A","category":"idea","difficulty":3,"prompt":"The making of silk","subtitle":"Boil the cocoon, kill the moth inside, and reel off a single thread half a mile long.","place":{"shape":"circle","lat":33.0,"lon":112.0,"radiusKm":500,"label":"The Yellow and Yangtze valleys"},"time":{"start":-3000,"end":-1000,"timeBasis":"floruit","label":"From the earliest silk finds through the Shang"},"lambdaYears":300,"lambdaKm":1000,"dateBasis":"archaeological","confidence":"medium","reveal":"Actual silk fabric survives from around 2700 BC at Qianshanyang; silk protein residues have been claimed from as early as 3600 BC. China held the monopoly for roughly three thousand years.","timeMax":1400,"placeMax":3600},{"id":"c10-tang-of-shang","chapter":10,"tier":"A","category":"ruler","difficulty":5,"prompt":"T'ang","subtitle":"Overthrew a tyrant and founded a dynasty, and is said to have offered himself as the sacrifice to end a seven-year drought.","place":{"shape":"circle","lat":34.45,"lon":115.65,"radiusKm":350,"label":"Bo, the first Shang capital, on the eastern plain"},"time":{"start":-1766,"end":-1580,"timeBasis":"reign","label":"Union of the traditional and reconstructed dates"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"conventional","confidence":"low","reveal":"The book follows the traditional chronology at 1766; the reconstructed date is about 1600. He replaces the Xia in the book's account, which never mentions that dynasty at all.","timeMax":1950,"placeMax":3050},{"id":"c10-yellow-emperor","chapter":10,"tier":"B","category":"ruler","difficulty":5,"prompt":"The Yellow Emperor (Huangdi)","subtitle":"Credited with the compass, the calendar, medicine, boats, and writing — which is one clue about how historical he is.","place":{"shape":"circle","lat":34.5,"lon":110.2,"radiusKm":350,"label":"The Yellow River valley"},"time":{"start":-2697,"end":-2597,"timeBasis":"reign","label":"Traditional reign dates"},"lambdaYears":250,"lambdaKm":900,"dateBasis":"traditional","confidence":"low","reveal":"These precise-looking dates come from Han-era chronologists working backward, about 2,500 years after the supposed events. Treat as culture-hero, not king.","timeMax":1700,"placeMax":3300},{"id":"c11-bantu-migration","chapter":11,"tier":"B","category":"event","difficulty":5,"prompt":"The Bantu migrations","subtitle":"Farmers with iron tools and yams spreading south and east across a continent over fifteen centuries.","place":{"shape":"multipoint","label":"From the Nigeria-Cameroon border across central and southern Africa","radiusKm":500,"points":[[6.5,11.0],[-4.0,22.0],[-6.0,35.0],[-20.0,28.0]]},"time":{"start":-1000,"end":500,"timeBasis":"event-year","label":"Main phases of expansion"},"lambdaYears":400,"lambdaKm":1500,"dateBasis":"archaeological","confidence":"low","reveal":"Reconstructed mainly from language relationships plus pottery and iron finds, not from any record. The scale is enormous — roughly a third of Africa now speaks a Bantu language.","timeMax":1400,"placeMax":3600},{"id":"c11-djenne-djenno","chapter":11,"tier":"A","category":"city","difficulty":5,"prompt":"Djenné-Djenno","subtitle":"The oldest known city south of the Sahara, built of mud brick on an island in the Niger flood plain.","place":{"shape":"circle","lat":13.9,"lon":-4.57,"radiusKm":80,"label":"Djenné-Djenno, inland Niger delta, Mali"},"time":{"start":-250,"end":500,"timeBasis":"occupation","label":"Occupation of the site (scored to the AD 500 timeline limit)","trueEnd":900},"lambdaYears":250,"lambdaKm":1000,"dateBasis":"archaeological","confidence":"medium","reveal":"Excavated from 1977, and important because it shows an African city arising before Arab or trans-Saharan trade contact rather than because of it. It also has no palace or citadel.","timeMax":1400,"placeMax":3600},{"id":"c11-nok","chapter":11,"tier":"A","category":"people-group","difficulty":4,"prompt":"The Nok culture","subtitle":"Life-size terracotta heads with triangular eyes, found in tin-mining spoil heaps, made by people who were already smelting iron.","place":{"shape":"circle","lat":9.6,"lon":8.5,"radiusKm":250,"label":"The Jos Plateau, central Nigeria"},"time":{"start":-900,"end":200,"timeBasis":"floruit","label":"Nok culture"},"lambdaYears":250,"lambdaKm":900,"dateBasis":"archaeological","confidence":"medium","reveal":"The earliest known figurative sculpture in sub-Saharan Africa. Most pieces have been looted rather than excavated, which is why the dating is coarser than it should be.","timeMax":1400,"placeMax":3600},{"id":"c11-west-african-iron","chapter":11,"tier":"B","category":"idea","difficulty":5,"prompt":"Ironworking in West Africa","subtitle":"Furnaces in the forest, with no Bronze Age in between.","place":{"shape":"circle","lat":10.0,"lon":6.0,"radiusKm":700,"label":"Nigeria, Niger, and the Central African fringe"},"time":{"start":-800,"end":-300,"timeBasis":"event-year","label":"Earliest well-dated smelting sites"},"lambdaYears":300,"lambdaKm":1000,"dateBasis":"archaeological","confidence":"low","reveal":"Whether the technology arrived from Carthage across the Sahara or was invented independently is genuinely unsettled; some claimed dates from Termit in Niger run much earlier and are disputed. Much of Africa went from stone to iron without a bronze stage.","timeMax":1400,"placeMax":3600},{"id":"c12-akrotiri","chapter":12,"tier":"C","category":"city","difficulty":5,"prompt":"Akrotiri","subtitle":"A town buried under volcanic ash with its frescoes intact, its pots stacked — and no bodies.","place":{"shape":"circle","lat":36.35,"lon":25.4,"radiusKm":40,"label":"Akrotiri, southern Thera"},"time":{"start":-2000,"end":-1600,"timeBasis":"occupation","label":"Until the eruption"},"lambdaYears":150,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"The Bronze Age Pompeii, except that everyone appears to have left in time — earthquakes gave warning. Its date of destruction inherits the whole Thera dispute.","timeMax":1400,"placeMax":3600},{"id":"c12-bull-leaping","chapter":12,"tier":"B","category":"object","difficulty":4,"prompt":"The bull-leaping fresco","subtitle":"Three figures, one bull, and a vault over the horns that may or may not be physically possible.","place":{"shape":"circle","lat":35.3,"lon":25.16,"radiusKm":50,"label":"Knossos"},"time":{"start":-1600,"end":-1450,"timeBasis":"construction","label":"Late palace period"},"lambdaYears":150,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"Bulls dominate Minoan art — horns of consecration on rooftops, bull-head rhyta, this fresco. Whether the leap was sport, ritual, or artistic convention is unresolved.","timeMax":1550,"placeMax":3450},{"id":"c12-knossos","chapter":12,"tier":"A","category":"structure","difficulty":3,"prompt":"The palace at Knossos","subtitle":"Twelve hundred rooms on five storeys around a central court, with light wells and flushing drains.","place":{"shape":"circle","lat":35.3,"lon":25.16,"radiusKm":50,"label":"Knossos, near Heraklion, Crete"},"time":{"start":-1950,"end":-1350,"timeBasis":"occupation","label":"First and second palace periods"},"lambdaYears":150,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"The first palace was destroyed around 1700 BC, probably by earthquake, and rebuilt grander. Much of what tourists photograph is Evans's reinforced-concrete reconstruction from the 1920s.","timeMax":1400,"placeMax":3600},{"id":"c12-linear-a","chapter":12,"tier":"C","category":"idea","difficulty":5,"prompt":"Linear A","subtitle":"The Minoan script — we can pronounce many of the signs and still understand nothing.","place":{"shape":"circle","lat":35.2,"lon":24.9,"radiusKm":180,"label":"Crete"},"time":{"start":-1800,"end":-1450,"timeBasis":"attestation","label":"Period of use"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"Because Linear B was derived from it and has been read since 1952, the sound values are largely known. The underlying language simply isn't Greek or anything else identifiable — the rare case of a decipherment that stalls at the last step.","timeMax":1400,"placeMax":3600},{"id":"c12-minoan-collapse","chapter":12,"tier":"A","category":"event","difficulty":4,"prompt":"The end of Minoan Crete","subtitle":"The palaces burn, and the next records from Knossos are written in Greek.","place":{"shape":"circle","lat":35.2,"lon":24.9,"radiusKm":180,"label":"Crete"},"time":{"start":-1470,"end":-1420,"timeBasis":"event-year","label":"Destruction of the palaces and Mycenaean takeover"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Volcano, earthquake, and Mycenaean invasion have all been blamed, and the eruption is now generally thought too early to be the direct cause. What is certain is that Linear B — Greek — replaces Linear A at Knossos afterward.","timeMax":1750,"placeMax":3250},{"id":"c12-minoans","chapter":12,"tier":"A","category":"people-group","difficulty":3,"prompt":"The Minoans","subtitle":"Europe's first civilization: sailors, frescoes full of dolphins and octopuses, and towns without walls.","place":{"shape":"circle","lat":35.2,"lon":24.9,"radiusKm":180,"label":"Crete and the Aegean islands"},"time":{"start":-2200,"end":-1450,"timeBasis":"floruit","label":"Minoan civilization; palaces from 1950 BC"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"archaeological","confidence":"high","reveal":"'Minoan' is Arthur Evans's coinage in 1900, taken from the myth. We have no idea what they called themselves, because their writing is unread.","timeMax":1400,"placeMax":3600},{"id":"c12-minotaur","chapter":12,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"King Minos and the Minotaur","subtitle":"A tribute of fourteen Athenian children, a maze nobody escapes, and a ball of thread.","place":{"shape":"circle","lat":35.3,"lon":25.16,"radiusKm":150,"label":"Knossos, Crete"},"time":{"start":-1700,"end":-1400,"timeBasis":"floruit","label":"The Bronze Age setting the Greeks assigned to the story"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"The story survives only in Greek sources written a thousand years later. Read as folk memory, it may preserve the fact that mainland Greeks once paid tribute to Crete — and the palace's plan really is labyrinthine.","timeMax":1400,"placeMax":3600},{"id":"c12-thera-eruption","chapter":12,"tier":"A","category":"event","difficulty":4,"prompt":"The eruption of Thera","subtitle":"An island blows its centre out, drops ash across the eastern Mediterranean, and sends a wave at Crete.","place":{"shape":"circle","lat":36.4,"lon":25.4,"radiusKm":60,"label":"Thera (Santorini)"},"time":{"start":-1620,"end":-1600,"timeBasis":"event-year","label":"Radiocarbon date"},"lambdaYears":120,"lambdaKm":500,"dateBasis":"archaeological","confidence":"low","reveal":"This is one of the sharpest dating disputes in archaeology. Radiocarbon and an olive branch buried in the ash point to about 1610 BC; Egyptian ceramic synchronisms point to about 1500 BC. A century of Aegean chronology hangs on it. Decide which you're scoring against before you ship.","timeMax":1550,"placeMax":3450},{"id":"c13-amenemhet","chapter":13,"tier":"A","category":"ruler","difficulty":4,"prompt":"Amenemhet","subtitle":"A vizier who took the throne, moved the capital, and left his son a warning that the men who eat your bread are the ones who plot against you.","place":{"shape":"circle","lat":29.57,"lon":31.07,"radiusKm":200,"label":"Itjtawy, near Lisht, at the mouth of the Faiyum"},"time":{"start":-1985,"end":-1926,"timeBasis":"reign","label":"Reign of Amenemhet I"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"He was assassinated in a palace conspiracy, which is the event the Tale of Sinuhe opens with. The book's end date runs to 1926, the scholarly one to 1956 — the difference is a co-regency with his son.","timeMax":2450,"placeMax":2550},{"id":"c13-avaris","chapter":13,"tier":"B","category":"city","difficulty":5,"prompt":"Avaris","subtitle":"A delta port full of Canaanite houses, Canaanite burials, and one wall of Minoan frescoes.","place":{"shape":"circle","lat":30.79,"lon":31.82,"radiusKm":50,"label":"Avaris (Tell el-Dab'a), eastern delta"},"time":{"start":-1780,"end":-1550,"timeBasis":"occupation","label":"Levantine settlement through the Hyksos capital"},"lambdaYears":120,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"Bull-leaping frescoes in Minoan style turned up here in the 1990s, which nobody expected and nobody has fully explained. Ramesses II later built his capital on the same ground.","timeMax":1400,"placeMax":3600},{"id":"c13-chariot","chapter":13,"tier":"B","category":"idea","difficulty":5,"prompt":"The war chariot comes to Egypt","subtitle":"A light spoked-wheel platform pulled by two horses, with a bow that shoots through armour.","place":{"shape":"circle","lat":30.6,"lon":31.6,"radiusKm":250,"label":"The Nile delta"},"time":{"start":-1650,"end":-1550,"timeBasis":"event-year","label":"Adopted during the Hyksos period"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Egypt lost to the technology and then mastered it — the New Kingdom army that conquered Syria was built around chariots the Hyksos introduced. The composite bow arrived with them.","timeMax":2350,"placeMax":2650},{"id":"c13-hyksos","chapter":13,"tier":"A","category":"people-group","difficulty":4,"prompt":"The Hyksos","subtitle":"Rulers of foreign lands — Semitic-speaking kings who took the delta while Egypt was divided.","place":{"shape":"circle","lat":30.79,"lon":31.82,"radiusKm":200,"label":"The eastern Nile delta, ruled from Avaris"},"time":{"start":-1650,"end":-1550,"timeBasis":"dynasty-span","label":"Fifteenth Dynasty rule in the delta"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Manetho's account of a violent invasion is not supported by the archaeology, which shows Levantine settlement in the delta building up over generations before any takeover.","timeMax":2350,"placeMax":2650},{"id":"c13-kerma","chapter":13,"tier":"A","category":"city","difficulty":5,"prompt":"Kerma","subtitle":"The capital of Kush, with a mud-brick temple the size of a cathedral and royal tombs ringed by hundreds of sacrificed retainers.","place":{"shape":"circle","lat":19.6,"lon":30.41,"radiusKm":80,"label":"Kerma, northern Sudan"},"time":{"start":-2500,"end":-1500,"timeBasis":"occupation","label":"Kingdom of Kerma, until conquered by Thutmose I"},"lambdaYears":200,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"Kush was a rival state, not a backwater: at Egypt's weakest it took Lower Nubia back and allied with the Hyksos against Thebes. The deffufa, its great mud-brick temple, still stands.","timeMax":1400,"placeMax":3600},{"id":"c13-middle-kingdom","chapter":13,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The Middle Kingdom of Egypt","subtitle":"Egypt put back together after a century of famine and warlords — later Egyptians called it the classical age.","place":{"shape":"circle","lat":27.8,"lon":31.3,"radiusKm":500,"label":"Egypt"},"time":{"start":-2055,"end":-1650,"timeBasis":"dynasty-span","label":"Eleventh through Thirteenth Dynasties"},"lambdaYears":120,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"The literature of this period — the Tale of Sinuhe, the Eloquent Peasant — became the schoolroom classics Egyptian scribes copied for the next thousand years.","timeMax":1800,"placeMax":3200},{"id":"c13-nubian-forts","chapter":13,"tier":"A","category":"structure","difficulty":5,"prompt":"The Egyptian forts at the Second Cataract","subtitle":"Mud-brick walls forty feet thick strung along the river, to hold the gold road and stop Nubians coming north.","place":{"shape":"circle","lat":21.9,"lon":31.3,"radiusKm":150,"label":"Buhen, Semna, and the Second Cataract, Lower Nubia"},"time":{"start":-1950,"end":-1840,"timeBasis":"construction","label":"Twelfth Dynasty fortress building"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Most of these sites now lie under Lake Nasser, drowned by the Aswan High Dam in the 1960s after emergency excavation.","timeMax":1650,"placeMax":3350},{"id":"c13-shaduf","chapter":13,"tier":"B","category":"idea","difficulty":5,"prompt":"The shaduf","subtitle":"A bucket on one end of a pole and a lump of clay on the other, so that one man can lift water all day without breaking his back.","place":{"shape":"circle","lat":27.8,"lon":31.3,"radiusKm":400,"label":"Along the Nile"},"time":{"start":-2000,"end":500,"timeBasis":"attestation","label":"In use from the Middle Kingdom onward"},"lambdaYears":350,"lambdaKm":700,"dateBasis":"archaeological","confidence":"medium","reveal":"A lever and a counterweight, and the reason a family could farm land the flood did not reach. Still in use along the Nile within living memory.","timeMax":1400,"placeMax":3600},{"id":"c13-thebes","chapter":13,"tier":"A","category":"city","difficulty":3,"prompt":"Thebes","subtitle":"The southern capital, with the living on the east bank where the sun rises and the dead on the west where it sets.","place":{"shape":"circle","lat":25.7,"lon":32.64,"radiusKm":60,"label":"Thebes, modern Luxor"},"time":{"start":-2100,"end":-100,"timeBasis":"occupation","label":"As capital and as religious centre"},"lambdaYears":250,"lambdaKm":400,"dateBasis":"conventional","confidence":"high","reveal":"Not the Greek Thebes of Oedipus — the Greeks gave the same name to both. Homer calls it the city of a hundred gates.","timeMax":1900,"placeMax":3100},{"id":"c14-ahmose","chapter":14,"tier":"A","category":"ruler","difficulty":4,"prompt":"Ahmose","subtitle":"The Theban king who drove the foreign rulers out of the delta and started Egypt's greatest age.","place":{"shape":"circle","lat":27.0,"lon":31.5,"radiusKm":450,"label":"Egypt, from Thebes to the delta"},"time":{"start":-1567,"end":-1525,"timeBasis":"reign","label":"Reign of Ahmose"},"lambdaYears":100,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Book gives 1567 for the expulsion of the Hyksos; Egyptologists put his reign about twenty years later. He founded the Eighteenth Dynasty.","timeMax":2450,"placeMax":2550},{"id":"c14-amarna","chapter":14,"tier":"B","category":"city","difficulty":5,"prompt":"Akhetaten (Amarna)","subtitle":"A capital built from nothing on virgin desert in about five years, and abandoned within twenty.","place":{"shape":"circle","lat":27.65,"lon":30.9,"radiusKm":50,"label":"Amarna, middle Egypt"},"time":{"start":-1346,"end":-1332,"timeBasis":"occupation","label":"Occupation of the city"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Because nobody built over it afterwards, it is the best-preserved Egyptian city we have — a whole society frozen at one moment.","timeMax":1900,"placeMax":3100},{"id":"c14-amenhotep-iv","chapter":14,"tier":"A","category":"ruler","difficulty":3,"prompt":"Amenhotep IV (Akhenaten)","subtitle":"A pharaoh who shut the old temples, changed his own name, and built a new capital on empty ground.","place":{"shape":"circle","lat":27.65,"lon":30.9,"radiusKm":200,"label":"Akhetaten (Amarna) and Thebes"},"time":{"start":-1353,"end":-1336,"timeBasis":"reign","label":"Reign of Amenhotep IV"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"conventional","confidence":"high","reveal":"Book and scholarship agree here within a year, which is unusual this far back — the Amarna letters give an unusually tight archive.","timeMax":2600,"placeMax":2400},{"id":"c14-amun-ra","chapter":14,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"Amon-Ra","subtitle":"A local Theban god fused with the sun god, whose priests grew rich enough to frighten pharaohs.","place":{"shape":"circle","lat":25.72,"lon":32.66,"radiusKm":250,"label":"Karnak, Thebes"},"time":{"start":-2000,"end":-1069,"timeBasis":"attestation","label":"From the Middle Kingdom through the New Kingdom"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"The same pattern as Marduk at Babylon: a city god rises with its city. Akhenaten's revolution is best read as a pharaoh trying to break the Amon priesthood's power, and it failed.","timeMax":1400,"placeMax":3600},{"id":"c14-aten","chapter":14,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"The Aten","subtitle":"The sun's disk with rays ending in little hands, worshipped as the only god worth worshipping.","place":{"shape":"circle","lat":27.65,"lon":30.9,"radiusKm":250,"label":"Akhetaten"},"time":{"start":-1353,"end":-1332,"timeBasis":"attestation","label":"The Amarna period"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"conventional","confidence":"high","reveal":"Whether this counts as monotheism, or as one god promoted so far above the others that they stopped mattering, is a real argument — and one worth having in a class that will meet the Shema soon after.","timeMax":2600,"placeMax":2400},{"id":"c14-deir-el-bahari","chapter":14,"tier":"B","category":"structure","difficulty":5,"prompt":"Hatshepsut's terraced temple","subtitle":"Three colonnaded terraces cut into a cliff, with a wall showing a whole expedition to Punt — ships, monkeys, and a very fat foreign queen.","place":{"shape":"circle","lat":25.74,"lon":32.61,"radiusKm":40,"label":"Deir el-Bahari, western Thebes"},"time":{"start":-1473,"end":-1458,"timeBasis":"construction","label":"Built during her reign"},"lambdaYears":100,"lambdaKm":400,"dateBasis":"conventional","confidence":"high","reveal":"Built beside, and modelled on, Mentuhotep II's temple of five hundred years earlier — deliberate architectural quotation.","timeMax":2600,"placeMax":2400},{"id":"c14-hatshepsut","chapter":14,"tier":"A","category":"ruler","difficulty":3,"prompt":"Hatshepsut","subtitle":"A woman who ruled as pharaoh, wore the false beard in her statues, and sent a fleet to a land of incense trees.","place":{"shape":"circle","lat":25.7,"lon":32.64,"radiusKm":200,"label":"Thebes"},"time":{"start":-1479,"end":-1458,"timeBasis":"reign","label":"Reign of Hatshepsut"},"lambdaYears":100,"lambdaKm":500,"dateBasis":"conventional","confidence":"high","reveal":"Her stepson Thutmose III had her name chiselled off monuments decades after her death — late enough that spite is an unlikely explanation, and succession politics a likelier one.","timeMax":2600,"placeMax":2400},{"id":"c14-nefertiti","chapter":14,"tier":"B","category":"person","difficulty":4,"prompt":"Nefertiti","subtitle":"Great royal wife, shown offering to the sun alongside her husband as an equal — and known chiefly from one unfinished bust.","place":{"shape":"circle","lat":27.65,"lon":30.9,"radiusKm":200,"label":"Akhetaten"},"time":{"start":-1370,"end":-1330,"timeBasis":"lifespan","label":"Approximate lifespan"},"lambdaYears":100,"lambdaKm":500,"dateBasis":"archaeological","confidence":"low","reveal":"She vanishes from the record around year 12 of the reign. One serious theory is that she did not die but became pharaoh herself under another name.","timeMax":1500,"placeMax":3500},{"id":"c14-new-kingdom","chapter":14,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The New Kingdom of Egypt","subtitle":"Egypt at its largest and richest — an empire reaching into Syria and deep into Nubia.","place":{"shape":"polygon","label":"From the Euphrates bend to the Fourth Cataract","points":[[36.0,38.0],[33.5,36.5],[31.0,34.0],[24.0,32.5],[19.0,30.5],[22.0,33.5],[30.0,30.0]]},"time":{"start":-1567,"end":-1069,"timeBasis":"dynasty-span","label":"Eighteenth through Twentieth Dynasties"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"The first Egyptian period in which pharaohs were buried in hidden rock-cut tombs rather than pyramids — a change forced by two thousand years of grave robbery.","timeMax":1800,"placeMax":3200},{"id":"c14-thutmose-i","chapter":14,"tier":"B","category":"ruler","difficulty":5,"prompt":"Thutmose I","subtitle":"A general, not a prince, who took the throne and marched an army to the Euphrates.","place":{"shape":"circle","lat":25.7,"lon":32.64,"radiusKm":300,"label":"Thebes"},"time":{"start":-1526,"end":-1493,"timeBasis":"reign","label":"Reign of Thutmose I"},"lambdaYears":100,"lambdaKm":500,"dateBasis":"conventional","confidence":"medium","reveal":"First pharaoh known to have been buried in the Valley of the Kings. Hatshepsut was his daughter.","timeMax":2500,"placeMax":2500},{"id":"c14-tutankhamen","chapter":14,"tier":"A","category":"ruler","difficulty":3,"prompt":"Tutankhamen","subtitle":"A boy king who undid his father's religion, died at eighteen, and mattered to nobody until ess bathing, and a sister watching from the bank.","place":{"shape":"circle","lat":30.8,"lon":31.83,"radiusKm":200,"label":"The eastern Nile delta"},"time":{"start":-1345,"end":-1335,"timeBasis":"event-year","label":"Kitchen scheme"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"The same motif appears in the birth legend of Sargon of Akkad, written down long after Sargon lived and long before Exodus was compiled. Shared Near Eastern storytelling, not borrowing anyone can demonstrate in either direction.","timeMax":1850,"placeMax":3150},{"id":"c15-exodus","chapter":15,"tier":"A","category":"event","difficulty":3,"prompt":"The Exodus from Egypt","subtitle":"A night of unleavened bread and blood on the doorposts, then a whole people walking east.","place":{"shape":"multipoint","label":"From Pi-Ramesse in the delta toward the Sinai","radiusKm":220,"points":[[30.8,31.83],[30.2,32.55],[28.54,33.97]]},"time":{"start":-1270,"end":-1250,"timeBasis":"event-year","label":"Kitchen: early in the reign of Ramesses II"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"The late date rests on Exodus 1:11, where the Israelites build the store-city Raamses — a place founded in the thirteenth century — and on the Merneptah Stele, which names Israel as a people in Canaan by 1208. The early date rests on 1 Kings 6:1 and gives 1446 instead. The book itself declines to print a date at all.","timeMax":1850,"placeMax":3150},{"id":"c15-jericho","chapter":15,"tier":"A","category":"event","difficulty":4,"prompt":"The walls of Jericho fall","subtitle":"Seven days of marching, seven priests with rams' horns, and a shout.","place":{"shape":"circle","lat":31.87,"lon":35.44,"radiusKm":80,"label":"Jericho, the Jordan valley"},"time":{"start":-1230,"end":-1200,"timeBasis":"event-year","label":"Kitchen scheme, a generation after the Exodus"},"lambdaYears":300,"lambdaKm":600,"dateBasis":"traditional","confidence":"low","reveal":"Kathleen Kenyon's excavation found the great walls destroyed around 1550 and no walled city standing in the thirteenth century at all. Bryant Wood has contested her ceramic dating. This is the sharpest collision in the corpus between text and spade, and worth telling a student honestly.","timeMax":1850,"placeMax":3150},{"id":"c15-merneptah-stele","chapter":15,"tier":"C","category":"object","difficulty":5,"prompt":"The Merneptah Stele","subtitle":"A pharaoh's victory boast that includes one line about a people, not a place, called Israel.","place":{"shape":"circle","lat":25.7,"lon":32.64,"radiusKm":100,"label":"Thebes"},"time":{"start":-1209,"end":-1207,"timeBasis":"event-year","label":"Year 5 of Merneptah"},"lambdaYears":60,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"The earliest mention of Israel outside the Bible, and the hinge of the whole Exodus dating argument: a people called Israel is in Canaan by 1208, so the Exodus must be earlier than that. Not in the book — include as enrichment.","timeMax":3100,"placeMax":1900},{"id":"c15-moses","chapter":15,"tier":"A","category":"person","difficulty":3,"prompt":"Moses","subtitle":"Drawn out of the river, raised in a palace, and sent back to the palace with a demand.","place":{"shape":"multipoint","label":"The eastern delta, Midian, and Sinai","radiusKm":200,"points":[[30.8,31.83],[28.54,33.97],[28.5,35.5]]},"time":{"start":-1340,"end":-1220,"timeBasis":"lifespan","label":"Traditional 120-year lifespan, Kitchen scheme"},"lambdaYears":300,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Derived, not attested: Exodus 7:7 makes him eighty at the confrontation with Pharaoh and Deuteronomy 34:7 gives him 120 years. On the 1 Kings 6:1 scheme this whole life shifts about two centuries earlier.","timeMax":1650,"placeMax":3350},{"id":"c15-passover","chapter":15,"tier":"A","category":"idea","difficulty":4,"prompt":"The Passover","subtitle":"Eaten standing, with sandals on and staff ean civilization"},"lambdaYears":150,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Where the Minoans built unwalled towns full of dolphins, these people built walls twenty feet thick. The contrast is the whole point of putting the two chapters next to each other.","timeMax":1400,"placeMax":3600},{"id":"c16-mycenaeans-in-crete","chapter":16,"tier":"A","category":"event","difficulty":4,"prompt":"The Mycenaeans take Crete","subtitle":"The palace at Knossos keeps running, but the clerks start writing in Greek.","place":{"shape":"circle","lat":35.3,"lon":25.16,"radiusKm":120,"label":"Knossos, Crete"},"time":{"start":-1470,"end":-1420,"timeBasis":"event-year","label":"Mycenaean takeover"},"lambdaYears":120,"lambdaKm":500,"dateBasis":"archaeological","confidence":"medium","reveal":"Pairs with the Minoan collapse item — same event from the other side.","timeMax":1750,"placeMax":3250},{"id":"c16-rise-of-polis","chapter":16,"tier":"B","category":"idea","difficulty":5,"prompt":"The first Greek city-states","subtitle":"A defensible hill, a market below it, and farmland around — repeated a thousand times and never unified.","place":{"shape":"circle","lat":38.3,"lon":23.5,"radiusKm":400,"label":"Greece and the Aegean coast"},"time":{"start":-860,"end":-750,"timeBasis":"event-year","label":"Book: the mid-800s"},"lambdaYears":150,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"Greek geography did most of the work — mountains and sea cut the country into pockets small enough to govern and too small to conquer each other permanently.","timeMax":2350,"placeMax":2650},{"id":"c16-sea-peoples","chapter":16,"tier":"B","category":"event","difficulty":5,"prompt":"The Sea Peoples and the Bronze Age collapse","subtitle":"Within fifty years every great palace from Greece to Syria burns, and nobody agrees who did it.","place":{"shape":"polygon","label":"The eastern Mediterranean","points":[[40.0,22.0],[40.5,36.5],[35.0,36.5],[30.5,32.0],[34. nding of Carthage","subtitle":"Settlers from Tyre on a North African headland, and a queen who bargained for as much land as an oxhide would cover.","place":{"shape":"circle","lat":36.85,"lon":10.32,"radiusKm":60,"label":"Carthage, near modern Tunis"},"time":{"start":-825,"end":-800,"timeBasis":"event-year","label":"Traditional date 814 BC"},"lambdaYears":120,"lambdaKm":600,"dateBasis":"traditional","confidence":"medium","reveal":"814 comes from later Greek and Roman writers; the earliest archaeology at the site is a few decades later. Dido's oxhide trick — cutting it into a thread to enclose a hill — is the kind of story colonies tell about themselves.","timeMax":2100,"placeMax":2900},{"id":"c17-murex","chapter":17,"tier":"B","category":"idea","difficulty":5,"prompt":"Tyrian purple","subtitle":"A gland from a sea snail, rotted in vats until the smell drove the dyeworks outside the city, and worth its weight in silver.","place":{"shape":"circle","lat":33.27,"lon":35.2,"radiusKm":150,"label":"Tyre and the Phoenician coast"},"time":{"start":-1500,"end":-300,"timeBasis":"floruit","label":"Phoenician dye industry"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"archaeological","confidence":"medium","reveal":"Roughly 12,000 snails for a gram and a half of dye. This is why purple means royalty — not taste, but arithmetic.","timeMax":1400,"placeMax":3600},{"id":"c17-phoenician-colonies","chapter":17,"tier":"B","category":"event","difficulty":4,"prompt":"The Phoenician colonies","subtitle":"Trading posts a day's sail apart, strung west past Sicily and out through the Pillars of Hercules.","place":{"shape":"multipoint","label":"Carthage, Motya, Cadiz, and the western Mediterranean","radiusKm":300,"points":[[36.85,10.32],[37.87,12.47],[36.53,-6.29],[39.55,2.63]]},"time":{"start":-900,"end":-600,"timeBasis":"event-year","label":"Main colonising period"},"lambdaYears":200,"lambdaKm":900,"dateBasis":"archaeological","confidence":"medium","reveal":"Cadiz was founded outside the Mediterranean entirely, on the Atlantic — they were sailing past Gibraltar centuries before any Greek did.","timeMax":1400,"placeMax":3600},{"id":"c17-phoenicians","chapter":17,"tier":"A","category":"people-group","difficulty":3,"prompt":"The Phoenicians","subtitle":"Canaanite traders on a strip of coast too narrow to farm, who therefore took to the sea.","place":{"shape":"polygon","label":"The Levantine coast","points":[[35.6,35.8],[34.6,36.2],[33.0,35.5],[32.9,35.0],[34.5,35.5]]},"time":{"start":-1200,"end":-700,"timeBasis":"floruit","label":"Height of Phoenician civilization"},"lambdaYears":200,"lambdaKm":600,"dateBasis":"conventional","confidence":"medium","reveal":"They called themselves Canaanites; 'Phoenician' is Greek, from the purple dye. Their rise fills the vacuum left by the Bronze Age collapse.","timeMax":1800,"placeMax":3200},{"id":"c17-sidon","chapter":17,"tier":"B","category":"city","difficulty":5,"prompt":"Sidon","subtitle":"Tyre's older rival up the coast, famous for glass.","place":{"shape":"circle","lat":33.56,"lon":35.37,"radiusKm":50,"label":"Sidon, Lebanon"},"time":{"start":-1200,"end":-333,"timeBasis":"floruit","label":"Phoenician period"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Blown glass may have been invented here in the first century BC — a technique that made glass cheap enough for ordinary Roman households.","timeMax":1400,"placeMax":3600},{"id":"c17-tyre","chapter":17,"tier":"A","category":"city","difficulty":4,"prompt":"Tyre","subtitle":"A city on an island half a mile offshore, which is why it held out against Assyria, Babylon, and everyone else until Alexander built a causeway.","place":{"shape":"circle","lat":33.27,"lon":35.2,"radiusKm":50,"label":"Tyre, southern Lebanon"},"time":{"start":-1200,"end":-332,"timeBasis":"floruit","label":"From the Phoenician height to Alexander's siege"},"lambdaYears":200,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"The ca "reveal":"So complete that two centuries later Xenophon marched a Greek army past the ruins and could not find out what city it had been.","timeMax":3100,"placeMax":1900},{"id":"c18-fall-of-samaria","chapter":18,"tier":"A","category":"event","difficulty":4,"prompt":"The fall of Samaria","subtitle":"The northern kingdom ends after a three-year siege, and its people are marched away and do not come back.","place":{"shape":"circle","lat":32.28,"lon":35.2,"radiusKm":80,"label":"Samaria, central Canaan"},"time":{"start":-722,"end":-720,"timeBasis":"event-year","label":"722 BC"},"lambdaYears":50,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"The ten northern tribes are deported and disappear from history. Judah in the south survives another 136 years — which is why the surviving tradition is a Judahite one, and why the word is Jew.","timeMax":3100,"placeMax":1900},{"id":"c18-library-of-ashurbanipal","chapter":18,"tier":"A","category":"object","difficulty":4,"prompt":"The library of Ashurbanipal","subtitle":"Thirty thousand clay tablets collected on royal orders — and preserved because the building burned.","place":{"shape":"circle","lat":36.36,"lon":43.15,"radiusKm":50,"label":"Nineveh"},"time":{"start":-668,"end":-627,"timeBasis":"construction","label":"Assembled during his reign"},"lambdaYears":60,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"The single richest source for Mesopotamian literature, and where the Epic of Gilgamesh was recovered in 1853. Fire bakes clay: the sack of Nineveh is the reason we can read any of it.","timeMax":3050,"placeMax":1950},{"id":"c18-neo-assyrian-empire","chapter":18,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The Neo-Assyrian Empire","subtitle":"The first empire to rule from the Nile to the Persian Gulf, and the first to deport whole nations as policy.","place":{"shape":"polygon","label":"From Egypt to the Zagros","points":[[38.5,36.0],[38.0,45.5],[33.0,48.5],[30.0,47.5],[29. BC"},"lambdaYears":50,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"Dated to the year by the Babylonian Chronicle as well as by 2 Kings. Arguably the most consequential event in the corpus for what comes after: a religion that had been tied to one temple in one place had to learn to survive without either.","timeMax":3100,"placeMax":1900},{"id":"c23-hanging-gardens","chapter":23,"tier":"A","category":"structure","difficulty":4,"prompt":"The Hanging Gardens","subtitle":"Terraces of trees watered by machinery, built — the story goes — to console a queen who missed her mountains.","place":{"shape":"circle","lat":32.54,"lon":44.42,"radiusKm":200,"label":"Babylon, traditionally"},"time":{"start":-605,"end":-562,"timeBasis":"construction","label":"Attributed to Nebuchadnezzar's reign"},"lambdaYears":100,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"The one wonder of the ancient world nobody has found. No Babylonian text mentions it, and Stephanie Dalley argues persuasively that the gardens were Sennacherib's at Nineveh, 500 km north, and got reassigned to the more famous city.","timeMax":1800,"placeMax":3200},{"id":"c23-ishtar-gate","chapter":23,"tier":"B","category":"structure","difficulty":5,"prompt":"The Ishtar Gate","subtitle":"A processional entrance in deep blue glaze, covered in bulls and dragons in yellow relief.","place":{"shape":"circle","lat":32.54,"lon":44.42,"radiusKm":50,"label":"Babylon"},"time":{"start":-580,"end":-570,"timeBasis":"construction","label":"Built under Nebuchadnezzar"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Excavated by Germans before the First World War and rebuilt inside a museum in Berlin, where it still is — one of the more awkward objects in the repatriation debate.","timeMax":1900,"placeMax":3100},{"id":"c23-nebuchadnezzar","chapter":23,"tier":"A","category":"ruler","difficulty":3,"prompt":"Nebuchadnezzar II","subtitle":"Rebuilt Babylon in glazed blue brick, and destroyed Jerusalem when it rebelled a second time.","place":{"shape":"circle","lat":32.54,"lon":44.42,"radiusKm":200,"label":"Babylon"},"time":{"start":-605,"end":-561,"timeBasis":"reign","label":"Reign of Nebuchadnezzar II"},"lambdaYears":60,"lambdaKm":600,"dateBasis":"secure","confidence":"high","reveal":"Book and scholarship differ by one year. Daniel 4 describes a period of madness in which he lived like an animal; Babylonian records are silent, which proves nothing either way.","timeMax":3050,"placeMax":1950},{"id":"c23-neo-babylonian-empire","chapter":23,"tier":"A","category":"empire-or-dynasty","difficulty":4,"prompt":"The Neo-Babylonian Empire","subtitle":"Babylon's second age of greatness, won by helping to destroy Assyria and lost in a single night.","place":{"shape":"polygon","label":"Mesopotamia and the Levant","points":[[37.0,38.0],[36.5,44.5],[33.0,47.5],[30.0,47.8],[30.5,34.5],[33.0,35.0],[35.5,36.0]]},"time":{"start":-626,"end":-539,"timeBasis":"dynasty-span","label":"Chaldean dynasty"},"lambdaYears":60,"lambdaKm":700,"dateBasis":"secure","confidence":"high","reveal":"Eighty-seven years, of which Nebuchadnezzar occupies half. Nearly everything the Bible and the tourist brochures attribute to Babylon belongs to this brief window rather than to Hammurabi's.","timeMax":3000,"placeMax":2000},{"id":"c24-achaemenid-empire","chapter":24,"tier":"A","category":"empire-or-dynasty","difficulty":3,"prompt":"The Persian Empire","subtitle":"The largest empire the world had yet seen, run by satraps, couriers, and a policy of leaving local customs alone.","place":{"shape":"polygon","label":"From the Aegean to the Indus","points":[[42.0,26.0],[42.5,40.0],[40.0,55.0],[37.0,70.0],[27.0,70.0],[25.0,55.0],[24.0,32.0],[31.0,27.0],[39.0,26.0]]},"time":{"start":-550,"end":-330,"timeBasis":"dynasty-span","label":"Achaemenid Empire"},"lambdaYears":80,"lambdaKm":1000,"dateBasis":"secure","confidence":"high","reveal":"Perhaps 44 percent of the world's population at its height — a larger share than any empire before or since. Tolerance was administration, not sentiment: a subject who kept his gods rebelled less.","timeMax":2750,"placeMax":2250},{"id":"c24-cyrus","chapter":24,"tier":"A","category":"ruler","difficulty":3,"prompt":"Cyrus the Great","subtitle":"Conquered from the Aegean to the Indus and made a policy of sending captive peoples home with their gods.","place":{"shape":"circle","lat":30.19,"lon":53.17,"radiusKm":300,"label":"Persia, ruled from Pasargadae"},"time":{"start":-559,"end":-525,"timeBasis":"reign","label":"Reign of Cyrus"},"lambdaYears":60,"lambdaKm":700,"dateBasis":"conventional","confidence":"high","reveal":"The book runs his reign five years long. Isaiah 45 calls him God's anointed — the only gentile in scripture given the title — for letting the exiles go home.","timeMax":2600,"placeMax":2400},{"id":"c24-cyrus-cylinder","chapter":24,"tier":"B","category":"object","difficulty":5,"prompt":"The Cyrus Cylinder","subtitle":"A clay barrel buried in a foundation, announcing that the new king has restored the gods to their proper homes.","place":{"shape":"circle","lat":32.54,"lon":44.42,"radiusKm":80,"label":"Babylon"},"time":{"start":-539,"end":-538,"timeBasis":"construction","label":"After the capture of Babylon"},"lambdaYears":60,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"Sometimes called the first charter of human rights, which overstates it considerably — the genre is standard Mesopotamian royal propaganda. It is still a striking match for the policy Ezra 1 describes.","timeMax":3100,"placeMax":1900},{"id":"c24-darius","chapter":24,"tier":"B","category":"ruler","difficulty":4,"prompt":"Darius I","subtitle":"Seized the throne in a coup, reorganised the empire into twenty provinces, and carved his account of it 100 metres up a cliff.","place":{"shape":"circle","lat":29.94,"lon":52.89,"radiusKm":300,"label":"Persia: Persepolis and Susa"},"time":{"start":-522,"end":-486,"timeBasis":"reign","label":"Reign of Darius I"},"lambdaYears":50,"lambdaKm":700,"dateBasis":"secure","confidence":"high","reveal":"The Behistun inscription, in three languages, is the Rosetta Stone of cuneiform — it is how Old Persian and then Akkadian were deciphered.","timeMax":3050,"placeMax":1950},{"id":"c24-medes","chapter":24,"tier":"B","category":"people-group","difficulty":5,"prompt":"The Medes","subtitle":"Horsemen of the Zagros who broke Assyria, and were then absorbed by their own southern cousins.","place":{"shape":"circle","lat":34.8,"lon":48.52,"radiusKm":300,"label":"Media, ruled from Ecbatana"},"time":{"start":-700,"end":-550,"timeBasis":"floruit","label":"The Median kingdom"},"lambdaYears":120,"lambdaKm":700,"dateBasis":"conventional","confidence":"medium","reveal":"Almost everything known about them comes from Herodotus and from their enemies; no Median archive has been found. 'The law of the Medes and Persians which altereth not' is a phrase from Daniel.","timeMax":2250,"placeMax":2750},{"id":"c24-pasargadae","chapter":24,"tier":"B","category":"structure","difficulty":5,"prompt":"The tomb of Cyrus","subtitle":"A plain gabled stone chamber on six steps, standing alone in a plain.","place":{"shape":"circle","lat":30.19,"lon":53.17,"radiusKm":60,"label":"Pasargadae, southern Iran"},"time":{"start":-530,"end":-525,"timeBasis":"construction","label":"After his death"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"archaeological","confidence":"high","reveal":"Alexander visited it, found it looted, and had it restored — a conqueror paying respects to the conqueror whose empire he had just taken.","timeMax":1900,"placeMax":3100},{"id":"c24-persepolis","chapter":24,"tier":"B","category":"structure","difficulty":4,"prompt":"Persepolis","subtitle":"A ceremonial capital with a staircase carved to show every subject nation bringing its tribute.","place":{"shape":"circle","lat":29.94,"lon":52.89,"radiusKm":50,"label":"Persepolis, southern Iran"},"time":{"start":-518,"end":-330,"timeBasis":"occupation","label":"From Darius's foundation to Alexander's burning"},"lambdaYears":80,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"The reliefs show twenty-three delegations, each in its own dress with its own goods — the best surviving picture of what an ancient empire thought it was.","timeMax":2800,"placeMax":2200},{"id":"c24-return-from-exile","chapter":24,"tier":"A","category":"event","difficulty":4,"prompt":"The return from exile","subtitle":"Fifty years after the temple burned, a Persian decree sends the exiles home to rebuild it.","place":{"shape":"multipoint","label":"From Babylon to Jerusalem","radiusKm":150,"points":[[32.54,44.42],[31.78,35.23]]},"time":{"start":-538,"end":-515,"timeBasis":"event-year","label":"From the decree to the second temple's completion"},"lambdaYears":60,"lambdaKm":600,"dateBasis":"conventional","confidence":"high","reveal":"Many chose not to go. The Jewish community in Babylonia remained one of the largest in the world for the next 1,500 years.","timeMax":2600,"placeMax":2400},{"id":"c24-royal-road","chapter":24,"tier":"B","category":"structure","difficulty":5,"prompt":"The Royal Road","subtitle":"1,600 miles of maintained highway with posting stations a day's ride apart, and riders who did not stop for weather.","place":{"shape":"multipoint","label":"From Susa to Sardis","radiusKm":250,"points":[[32.19,48.26],[37.15,38.79],[38.49,28.04]]},"time":{"start":-520,"end":-330,"timeBasis":"occupation","label":"Achaemenid period"},"lambdaYears":80,"lambdaKm":700,"dateBasis":"conventional","confidence":"high","reveal":"Herodotus's description of the couriers — stopped by neither snow nor rain nor heat nor night — is the source of the motto on the New York post office.","timeMax":2300,"placeMax":2700},{"id":"c25-aryans-enter-india","chapter":25,"tier":"A","category":"event","difficulty":4,"prompt":"The Aryans come into India","subtitle":"Cattle-herding, chariot-driving, Sanskrit-speaking newcomers moving down into the Punjab.","place":{"shape":"circle","lat":31.5,"lon":73.0,"radiusKm":400,"label":"The Punjab and the upper Indus"},"time":{"start":-1800,"end":-1200,"timeBasis":"event-year","label":"Indo-Aryan migration"},"lambdaYears":250,"lambdaKm":800,"dateBasis":"archaeological","confidence":"low","reveal":"The older 'Aryan invasion' model, in which newcomers destroyed the Indus cities, is dead — the cities were already empty. Whether this was migration, gradual infiltration, or largely a linguistic spread is contested, and the question is politically charged in India today. The word 'Aryan' means noble in Sanskrit and has nothing to do with its twentieth-century European misuse.","timeMax":1400,"placeMax":3600},{"id":"c25-bodh-gaya","chapter":25,"tier":"A","category":"event","difficulty":4,"prompt":"The enlightenment under the bodhi tree","subtitle":"Six years of starving himself having failed, he eats a bowl of rice, sits down under a fig tree, and refuses to get up.","place":{"shape":"circle","lat":24.7,"lon":84.99,"radiusKm":150,"label":"Bodh Gaya, Bihar"},"time":{"start":-528,"end":-430,"timeBasis":"event-year","label":"Traditional 528 BC; short chronology c. 430"},"lambdaYears":120,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"A descendant of the tree is still growing there, propagated from a cutting taken to Sri Lanka in the third century BC and brought back after the original died.","timeMax":1700,"placeMax":3300},{"id":"c25-caste-system","chapter":25,"tier":"A","category":"idea","difficulty":4,"prompt":"The four varnas","subtitle":"Priests from the mouth, warriors from the arms, merchants from the thighs, labourers from the feet of a primeval man.","place":{"shape":"circle","lat":26.5,"lon":79.0,"radiusKm":500,"label":"Northern India"},"time":{"start":-1200,"end":-500,"timeBasis":"attestation","label":"From the Purusha hymn onward"},"lambdaYears":250,"lambdaKm":900,"dateBasis":"conventional","confidence":"medium","reveal":"The Purusha Sukta of the Rigveda is the founding text. The four varnas are not the same thing as the thousands of jati, or birth-groups, that structure actual Indian society — a distinction most textbooks blur.","timeMax":1800,"placeMax":3200},{"id":"c25-first-sermon","chapter":25,"tier":"B","category":"event","difficulty":5,"prompt":"The first sermon at Sarnath","subtitle":"In a deer park, to five men who had walked out on him, he sets out four truths and a middle way.","place":{"shape":"circle","lat":25.38,"lon":83.02,"radiusKm":120,"label":"Sarnath, near Varanasi"},"time":{"start":-528,"end":-430,"timeBasis":"event-year","label":"Shortly after the enlightenment"},"lambdaYears":120,"lambdaKm":700,"dateBasis":"traditional","confidence":"low","reveal":"Ashoka built a pillar here 250 years later; its lion capital is now the emblem of the Republic of India, and the wheel from its base is on the flag.","timeMax":1700,"placeMax":3300},{"id":"c25-ganges","chapter":25,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"The descent of the Ganges","subtitle":"A king's penance brings a river down from heaven, and a god stands under it to break the fall.","place":{"shape":"circle","lat":25.32,"lon":83.01,"radiusKm":400,"label":"The Ganges at Varanasi"},"time":{"start":-800,"end":400,"timeBasis":"attestation","label":"Attested in the epics and Puranas"},"lambdaYears":350,"lambdaKm":800,"dateBasis":"traditional","confidence":"low","reveal":"The centre of Indian civilization shifts east from the Indus to the Ganges during the Vedic period, and the mythology follows the population.","timeMax":1400,"placeMax":3600},{"id":"c25-shiva","chapter":25,"tier":"B","category":"deity-or-myth","difficulty":5,"prompt":"Shiva","subtitle":"Ascetic on a mountain and lord of the dance, who caught the falling river in his hair so it would not shatter the earth.","place":{"shape":"circle","lat":26.5,"lon":79.0,"radiusKm":500,"label":"Northern India"},"time":{"start":-1200,"end":500,"timeBasis":"attestation","label":"From Vedic Rudra to the classical deity"},"lambdaYears":350,"lambdaKm":900,"dateBasis":"traditional","confidence":"low","reveal":"Develops out of the Vedic storm god Rudra. A seal from Mohenjo-daro showing a horned seated figure has been claimed as a proto-Shiva, which would push him back a millennium — the claim is contested and unprovable while the Indus script stays unread.","timeMax":1400,"placeMax":3600},{"id":"c25-siddhartha","chapter":25,"tier":"A","category":"person","difficulty":3,"prompt":"Siddhartha Gautama","subtitle":"A prince kept from seeing anything unpleasant, who saw four things and left the palace that night.","place":{"shape":"circle","lat":27.47,"lon":83.28,"radiusKm":250,"label":"Lumbini and the Nepalese foothills"},"time":{"start":-563,"end":-400,"timeBasis":"lifespan","label":"Union of the long and short chronologies"},"lambdaYears":120,"lambdaKm":700,"dateBasis":"conventional","confidence":"low","reveal":"The dates depend on counting backward from Ashoka, and the Sri Lankan and Indian traditions count differently. Even the century is not fully settled.","timeMax":2000,"placeMax":3000},{"id":"c25-upanishads","chapter":25,"tier":"B","category":"text","difficulty":5,"prompt":"The Upanishads","subtitle":"Forest dialogues asking what is behind the ritual — and answering that the self and the ultimate are the same thing.","place":{"shape":"circle","lat":26.5,"lon":81.0,"radiusKm":450,"label":"The Ganges plain, east of Delhi"},"time":{"start":-800,"end":-400,"timeBasis":"construction","label":"The principal Upanishads"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"Roughly contemporary with the Hebrew prophets, the pre-Socratics, and Confucius — the cluster Jaspers named the Axial Age. Whether that simultaneity means anything is a good argument to have with a bright student.","timeMax":1800,"placeMax":3200},{"id":"c25-vedas","chapter":25,"tier":"A","category":"text","difficulty":4,"prompt":"The Vedas","subtitle":"Hymns memorised syllable by syllable and passed down by voice for a thousand years before anyone wrote them.","place":{"shape":"circle","lat":30.0,"lon":76.0,"radiusKm":400,"label":"Northwest India"},"time":{"start":-1500,"end":-500,"timeBasis":"construction","label":"Composition of the Vedic corpus"},"lambdaYears":250,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"The oral transmission used redundant recitation schemes designed to catch errors, and it worked — the text is thought to have come down with extraordinary fidelity. Among the oldest surviving literature in any Indo-European language.","timeMax":1800,"placeMax":3200},{"id":"c26-analects","chapter":26,"tier":"A","category":"text","difficulty":4,"prompt":"The Analects","subtitle":"Fragments of conversation collected by students — the Master said, and then a sentence.","place":{"shape":"circle","lat":35.6,"lon":116.99,"radiusKm":300,"label":"Lu and the eastern plain"},"time":{"start":-475,"end":-221,"timeBasis":"construction","label":"Compilation after his death"},"lambdaYears":150,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"Confucius wrote nothing. The version we read was assembled by disciples of disciples, which is worth noticing next to the Gospels and the Buddhist sutras — the same transmission problem, three times over, in the same few centuries.","timeMax":2050,"placeMax":2950},{"id":"c26-confucius","chapter":26,"tier":"A","category":"person","difficulty":3,"prompt":"Confucius","subtitle":"A minor official who could not get a ruler to employ him, and spent his life teaching instead.","place":{"shape":"circle","lat":35.6,"lon":116.99,"radiusKm":200,"label":"Qufu, in the state of Lu"},"time":{"start":-551,"end":-479,"timeBasis":"lifespan","label":"Lifespan"},"lambdaYears":100,"lambdaKm":700,"dateBasis":"conventional","confidence":"high","reveal":"He thought himself a failure — a transmitter of old ways rather than an innovator. Book and scholarship agree on the dates. Contemporary, near enough, with the Buddha and the Athenian democracy.","timeMax":2500,"placeMax":2500},{"id":"c26-laozi","chapter":26,"tier":"C","category":"person","difficulty":5,"prompt":"Laozi","subtitle":"Said to have left China westward on an ox, stopping at the pass only because a guard asked him to write something down first.","place":{"shape":"circle","lat":34.4,"lon":112.5,"radiusKm":400,"label":"The Zhou capital region"},"time":{"start":-600,"end":-300,"timeBasis":"floruit","label":"Traditional 6th century; the text is 4th-3rd century"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"traditional","confidence":"low","reveal":"Probably not a person. Most scholars treat the Daodejing as a composite text and 'Old Master' as a title rather than a name. Not in the pronunciation guide — enrichment only.","timeMax":1400,"placeMax":3600},{"id":"c26-mandate-of-heaven","chapter":26,"tier":"A","category":"idea","difficulty":4,"prompt":"The Mandate of Heaven","subtitle":"Heaven appoints the ruler and can withdraw the appointment — so a successful rebellion proves it already has.","place":{"shape":"circle","lat":34.5,"lon":110.0,"radiusKm":450,"label":"The Zhou heartland"},"time":{"start":-1046,"end":500,"timeBasis":"attestation","label":"From the Zhou conquest onward; scored to the end of the ancient period (scored to the AD 500 timeline limit)","trueEnd":1912},"lambdaYears":250,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"Invented by the Zhou to justify overthrowing the Shang, and then used against every Chinese dynasty for the next three thousand years — a doctrine of legitimacy that contains its own instructions for revolution.","timeMax":1800,"placeMax":3200},{"id":"c26-spring-and-autumn","chapter":26,"tier":"B","category":"event","difficulty":5,"prompt":"The Spring and Autumn period","subtitle":"The Zhou kings still on the throne, and nobody paying attention to them.","place":{"shape":"circle","lat":35.0,"lon":114.0,"radiusKm":500,"label":"North China"},"time":{"start":-771,"end":-476,"timeBasis":"event-year","label":"Spring and Autumn period"},"lambdaYears":120,"lambdaKm":800,"dateBasis":"conventional","confidence":"high","reveal":"Named after a chronicle of the state of Lu traditionally credited to Confucius. Warfare in this period was still governed by aristocratic convention; that is what the next period ends.","timeMax":2100,"placeMax":2900},{"id":"c26-sun-tzu","chapter":26,"tier":"C","category":"text","difficulty":5,"prompt":"The Art of War","subtitle":"Thirteen chapters arguing that the best battle is the one you never have to fight.","place":{"shape":"circle","lat":32.0,"lon":119.5,"radiusKm":400,"label":"The state of Wu, lower Yangtze"},"time":{"start":-500,"end":-400,"timeBasis":"construction","label":"Composition"},"lambdaYears":150,"lambdaKm":800,"dateBasis":"conventional","confidence":"low","reveal":"Whether Sun Tzu existed is disputed on the same grounds as Laozi. Not in the pronunciation guide — enrichment only.","timeMax":2100,"placeMax":2900},{"id":"c26-warring-states","chapter":26,"tier":"A","category":"event","difficulty":4,"prompt":"The Period of the Warring States","subtitle":"Seven kingdoms, mass conscript armies with crossbows, and no rules left.","place":{"shape":"polygon","label":"North and central China","points":[[40.0,111.0],[40.5,120.0],[33.0,121.0],[29.0,114.0],[31.0,106.0],[35.5,106.5]]},"time":{"start":-500,"end":-221,"timeBasis":"event-year","label":"Warring States period"},"lambdaYears":100,"lambdaKm":900,"dateBasis":"conventional","confidence":"high","reveal":"Chinese philosophy's most productive era, because a hundred schools were competing to tell rulers how to survive. It ends when one of the seven wins.","timeMax":2100,"placeMax":2900},{"id":"c26-zhou-dynasty","chapter":26,"tier":"A","category":"empire-or-dynasty","difficulty":4,"prompt":"The Zhou dynasty","subtitle":"China's longest dynasty, which spent its last five centuries unable to control anyone.","place":{"shape":"circle","lat":34.62,"lon":112.45,"radiusKm":450,"label":"The Yellow River valley, ruled from Luoyang"},"time":{"start":-1122,"end":-256,"timeBasis":"dynasty-span","label":"Zhou dynasty"},"lambdaYears":200,"lambdaKm":800,"dateBasis":"conventional","confidence":"medium","reveal":"The start date inherits the same dispute as the end of the Shang — the book's 1122 against the reconstructed 1046. Nearly 800 years, of which the kings genuinely ruled for perhaps 250.","timeMax":1800,"placeMax":3200},{"id":"c27-alcibiades","chapter":27,"tier":"B","category":"person","difficulty":5,"prompt":"Alcibiades","subtitle":"Argued for the Sicilian expedition, was recalled to stand trial, defected to Sparta, then to Persia, then came home to a hero's welcome.","place":{"shape":"circle","lat":37.98,"lon":23.73,"radiusKm":300,"label":"Athens, Sparta, and Persia"},"time":{"start":-450,"end":-404,"timeBasis":"lifespan","label":"Lifespan"},"lambdaYears":50,"lambdaKm":700,"dateBasis":"secure","confidence":"high","reveal":"Socrates' most brilliant and least creditable student. His career is the strongest contemporary argument that Athenian democracy could not manage the men it produced.","timeMax":3050,"placeMax":1950},{"id":"c27-delian-league","chapter":27,"tier":"B","category":"idea","difficulty":5,"prompt":"The Delian League","subtitle":"An alliance against Persia whose treasury Athens moved to Athens, and whose members discovered they could not leave.","place":{"shape":"circle","lat":37.39,"lon":25.27,"radiusKm":250,"label":"Delos, then Athens"},"time":{"start":-478,"end":-404,"timeBasis":"dynasty-span","label":"From founding to dissolution"},"lambdaYears":60,"lambdaKm":600,"dateBasis":"secure","confidence":"high","reveal":"The Parthenon was built with League money. Athens called it a league; Thucydides calls it an empire and has the Athenians say so themselves.","timeMax":3000,"placeMax":2000},{"id":"c27-ionian-
