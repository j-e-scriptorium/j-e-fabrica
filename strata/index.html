lation rather than by the gods.","timeMax":3100,"placeMax":1900},{"id":"c27-pheidippides","chapter":27,"tier":"A","category":"event","difficulty":4,"prompt":"The first marathon run","subtitle":"A messenger runs the twenty-five miles back to the city, delivers one word, and dies.","place":{"shape":"multipoint","label":"Marathon to Athens","radiusKm":60,"points":[[38.15,23.96],[37.98,23.73]]},"time":{"start":-490,"end":-490,"timeBasis":"event-year","label":"490 BC"},"lambdaYears":40,"lambdaKm":400,"dateBasis":"traditional","confidence":"low","reveal":"Herodotus, our best source, does not tell this story — his Pheidippides runs 150 miles to Sparta for help before the battle, and survives. The dying messenger appears 600 years later in Plutarch and Lucian. The modern race distance was fixed at 26.2 miles in 1908 to suit the London course.","timeMax":1850,"placeMax":3150},{"id":"c27-plato","chapter":27,"tier":"A","category":"person","difficulty":4,"prompt":"Plato","subtitle":"Wrote his teacher into every book, and founded a school in an olive grove that ran for 900 years.","place":{"shape":"circle","lat":37.99,"lon":23.71,"radiusKm":80,"label":"The Academy, Athens"},"time":{"start":-428,"end":-348,"timeBasis":"lifespan","label":"Lifespan"},"lambdaYears":50,"lambdaKm":500,"dateBasis":"conventional","confidence":"high","reveal":"Watching Athens execute Socrates permanently soured him on democracy, which is the argument the Republic is really having.","timeMax":2500,"placeMax":2500},{"id":"c27-salamis","chapter":27,"tier":"A","category":"battle","difficulty":3,"prompt":"The Battle of Salamis","subtitle":"The Greeks let themselves be trapped in a narrow strait, where a bigger fleet was a worse fleet.","place":{"shape":"circle","lat":37.95,"lon":23.5,"radiusKm":40,"label":"The straits of Salamis, off Athens"},"time":{"start":-480,"end":-480,"timeBasis":"event-year","label":"480 BC"},"lambdaYears":40,"lambdaKm":400,"dateBasis":"secure","confidence":"high","reveal":"Xerxes watched from a throne on the shore. Themistocles had reportedly sent him a false message that the Greeks were about to flee, to make sure he sailed into the narrows.","timeMax":3100,"placeMax":1900},{"id":"c27-sicilian-expedition","chapter":27,"tier":"B","category":"battle","difficulty":5,"prompt":"The Sicilian Expedition","subtitle":"Athens sends its fleet 800 miles west in the middle of a war it has not won, and gets none of it back.","place":{"shape":"circle","lat":37.07,"lon":15.29,"radiusKm":80,"label":"Syracuse, Sicily"},"time":{"start":-415,"end":-413,"timeBasis":"event-year","label":"415-413 BC"},"lambdaYears":50,"lambdaKm":600,"dateBasis":"secure","confidence":"high","reveal":"Two hundred ships and 40,000 men lost. Thucydides ends his account by saying that few out of many returned home — the single most quoted sentence about strategic overreach ever written.","timeMax":3100,"placeMax":1900},{"id":"c27-socrates","chapter":27,"tier":"A","category":"person","difficulty":4,"prompt":"The death of Socrates","subtitle":"Convicted of corrupting the young and not believing in the city's gods, he declines to escape and drinks the hemlock.","place":{"shape":"circle","lat":37.98,"lon":23.73,"radiusKm":60,"label":"Athens"},"time":{"start":-399,"end":-399,"timeBasis":"event-year","label":"399 BC"},"lambdaYears":40,"lambdaKm":400,"dateBasis":"secure","confidence":"high","reveal":"Five years after Athens lost the war, and his association with Alcibiades and other men who had betrayed the city is the political background the charges do not mention.","timeMax":3100,"placeMax":1900},{"id":"c27-thermopylae","chapter":27,"tier":"A","category":"battle","difficulty":3,"prompt":"The Battle of Thermopylae","subtitle":"A pass wide enough for one cart, held for three days, until somebody showed the Persians a path over the mountain.","place":{"shape":"circle","lat":38.8,"lon":22.54,"radiusKm":50,"label":"Thermopylae, central Greece"},"time":{"start":-480,"end":-480,"timeBasis":"event-ye "Forty years of Alexander's generals fighting over the pieces, until three of them are left.","place":{"shape":"polygon","label":"From Greece to Persia","points":[[41.0,21.0],[42.0,40.0],[36.0,55.0],[29.0,50.0],[30.0,30.0],[36.0,26.0]]},"time":{"start":-323,"end":-281,"timeBasis":"event-year","label":"The Diadochi wars"},"lambdaYears":60,"lambdaKm":800,"dateBasis":"secure","confidence":"high","reveal":"Alexander's mother, wife, and son were all murdered in the course of it. The empire lasted less than two years intact.","timeMax":3050,"placeMax":1950},{"id":"c28-gaugamela","chapter":28,"tier":"A","category":"battle","difficulty":4,"prompt":"The Battle of Gaugamela","subtitle":"Darius picks flat ground and levels it further for his chariots; Alexander rides at a gap in the line and the Great King runs.","place":{"shape":"circle","lat":36.36,"lon":43.25,"radiusKm":80,"label":"Gaugamela, northern Mesopotamia"},"time":{"start":-331,"end":-331,"timeBasis":"event-year","label":"1 October 331 BC"},"lambdaYears":40,"lambdaKm":500,"dateBasis":"secure","confidence":"high","reveal":"Dated to the day by a Babylonian astronomical tablet that also records a lunar eclipse eleven days before. The Persian Empire effectively ends here.","timeMax":3100,"placeMax":1900},{"id":"c28-gordian-knot","chapter":28,"tier":"B","category":"event","difficulty":4,"prompt":"The Gordian knot","subtitle":"Whoever unties it will rule Asia, said the oracle, and he found a way that was not untying.","place":{"shape":"circle","lat":39.65,"lon":31.99,"radiusKm":100,"label":"Gordium, central Anatolia"},"time":{"start":-333,"end":-333,"timeBasis":"event-year","label":"333 BC"},"lambdaYears":50,"lambdaKm":600,"dateBasis":"traditional","confidence":"medium","reveal":"One ancient version has him pull out the pole-pin and slip the yoke off, which is cleverer and much less quotable than the sword.","timeMax":2100,"placeMax":2900},{"id":"c28-library-of-alexandria","chapter":28,"tier":"A","category":"structure","d ovince.","timeMax":2650,"placeMax":2350},{"id":"c28-seleucid-empire","chapter":28,"tier":"B","category":"empire-or-dynasty","difficulty":5,"prompt":"The Seleucid Empire","subtitle":"The largest and most unmanageable of Alexander's fragments, stretching from Anatolia toward India and shrinking every generation.","place":{"shape":"polygon","label":"Syria, Mesopotamia, and Iran","points":[[38.5,32.0],[39.0,48.0],[37.0,62.0],[29.0,60.0],[30.0,47.0],[33.5,35.0]]},"time":{"start":-312,"end":-63,"timeBasis":"dynasty-span","label":"Seleucid dynasty"},"lambdaYears":80,"lambdaKm":800,"dateBasis":"secure","confidence":"high","reveal":"Their attempt to force Greek religion on Judea provokes the Maccabean revolt in 167 — the origin of Hanukkah, and the reason this dynasty matters to a curriculum with this centre of gravity.","timeMax":2700,"placeMax":2300},{"id":"c29-asoka","chapter":29,"tier":"A","category":"ruler","difficulty":3,"prompt":"Asoka","subtitle":"Conquered one more kingdom, was appalled at what he had done, and spent the rest of his reign apologising in stone.","place":{"shape":"circle","lat":25.61,"lon":85.14,"radiusKm":400,"label":"The Mauryan Empire, ruled from Pataliputra"},"time":{"start":-268,"end":-232,"timeBasis":"reign","label":"Reign of Asoka"},"lambdaYears":60,"lambdaKm":800,"dateBasis":"conventional","confidence":"high","reveal":"H. G. Wells called him the only military monarch on record who renounced war after victory. He was forgotten in India for two thousand years and recovered only when his inscriptions were deciphered in 1837.","timeMax":2550,"placeMax":2450},{"id":"c29-asoka-edicts","chapter":29,"tier":"A","category":"text","difficulty":4,"prompt":"The edicts of Asoka","subtitle":"Instructions on mercy, vegetarianism, and shade trees, cut into rocks and polished pillars from Afghanistan to Karnataka.","place":{"shape":"multipoint","label":"Across the empire: Sarnath, Sanchi, Dhauli, Kandahar","radiusKm":350,"points":[[25.38,83.02],[23.48,77.74],[2 ti is named for the society of officers who took the name.","timeMax":1850,"placeMax":3150},{"id":"c31-gladiators","chapter":31,"tier":"A","category":"idea","difficulty":4,"prompt":"The gladiators","subtitle":"Matched by type rather than at random — a man with a big shield and short sword against a man with a net and trident.","place":{"shape":"circle","lat":41.89,"lon":12.49,"radiusKm":400,"label":"Rome and Italy"},"time":{"start":-264,"end":404,"timeBasis":"floruit","label":"From the first recorded munus to the last games at Rome"},"lambdaYears":150,"lambdaKm":700,"dateBasis":"conventional","confidence":"high","reveal":"It began as a funeral rite in honour of the dead and became mass entertainment. Trained fighters were expensive, so most bouts did not end in death — perhaps one in ten in the early empire.","timeMax":1900,"placeMax":3100},{"id":"c31-janus","chapter":31,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"Janus","subtitle":"Two faces, one looking forward and one back — god of doorways, beginnings, and the gate that stood open whenever Rome was at war.","place":{"shape":"circle","lat":41.893,"lon":12.485,"radiusKm":150,"label":"The Janus Geminus in the Forum, Rome"},"time":{"start":-700,"end":391,"timeBasis":"attestation","label":"Traditionally from Numa's reign"},"lambdaYears":250,"lambdaKm":600,"dateBasis":"traditional","confidence":"medium","reveal":"He has no Greek equivalent at all — a genuinely Roman god. Augustus boasted of closing the gates three times; before him they had been shut twice in seven hundred years. January is his month.","timeMax":1400,"placeMax":3600},{"id":"c31-jove","chapter":31,"tier":"A","category":"deity-or-myth","difficulty":4,"prompt":"Jove (Jupiter)","subtitle":"Best and greatest — sky-father, thrower of lightning, and the god a victorious general dressed as during his triumph.","place":{"shape":"circle","lat":41.892,"lon":12.483,"radiusKm":150,"label":"The Capitoline temple, Rome"},"time":{"start":-509,"end" function yearToFrac(y){y=Math.max(MIN,Math.min(MAX,y));let acc=0;
 for(let k=0;k<BANDS.length;k++){const b=BANDS[k];
  if(y<=b.b||k===BANDS.length-1){const t=(y-b.a)/(b.b-b.a);return (acc+Math.max(0,Math.min(1,t))*b.w)/100;}
  acc+=b.w;}return 1;}
function fracToYear(f){let p=Math.max(0,Math.min(1,f))*100,acc=0;
 for(let k=0;k<BANDS.length;k++){const b=BANDS[k];
  if(p<=acc+b.w||k===BANDS.length-1)return Math.round(b.a+((p-acc)/b.w)*(b.b-b.a));

/* ---------- geometry ---------- */
const R=6371,rad=d=>d*Math.PI/180;
function haversine(a,b,c,d){const dLat=rad(c-a),dLon=rad(d-b);
 const s=Math.sin(dLat/2)**2+Math.cos(rad(a))*Math.cos(rad(c))*Math.sin(dLon/2)**2;
 return 2*R*Math.asin(Math.min(1,Math.sqrt(s)));}
const proj=(lat,lon,lat0)=>[rad(lon)*R*Math.cos(rad(lat0)),rad(lat)*R];
function nearestOnSeg(p,a,b){const vx=b[0]-a[0],vy=b[1]-a[1],wx=p[0]-a[0],wy=p[1]-a[1];
 const L=vx*vx+vy*vy;let t=L?((wx*vx+wy*vy)/L):0;t=Math.max(0,Math.min(1,t));
 const cx=a[0]+t*vx,cy=a[1]+t*vy;return {d:Math.hypot(p[0]-cx,p[1]-cy),x:cx,y:cy};}
function unproj(xy,lat0){return [xy[1]/R*180/Math.PI,xy[0]/(R*Math.cos(rad(lat0)))*180/Math.PI];}
function inPoly(lat,lon,pts){let c=false;
 for(let i=0,j=pts.length-1;i<pts.length;j=i++){const yi=pts[i][0],xi=pts[i][1],yj=pts[j][0],xj=pts[j][1];
  if(((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c;}return c;}
/* Distance outside the answer shape, plus (when outside) the nearest point
   on it — the reference the miss direction is measured from. */
function placeMiss(g,p){
 if(p.shape==='circle'){const km=Math.max(0,haversine(g.lat,g.lng,p.lat,p.lon)-p.radiusKm);
  return {km,ref:km?[p.lat,p.lon]:null};}
 if(p.shape==='multipoint'){let best=Infinity,bestPt=null;
  p.points.forEach(q=>{const d=haversine(g.lat,g.lng,q[0],q[1]);if(d<best){best=d;bestPt=q;}});
  const km=Math.max(0,best-(p.radiusKm||100));return {km,ref:km?bestPt:null};}
 if(p.shape==='polygon'){if(inPoly(g.lat,g.lng,p.points))return {km:0,ref:null};
  const lat0=p.points.reduce((s,q)=>s+q[0],0)/p.points.length;
  const P=proj(g.lat,g.lng,lat0),V=p.points.map(q=>proj(q[0],q[1],lat0));
  let m=Infinity,mx=0,my=0;
  for(let i=0,j=V.length-1;i<V.length;j=i++){const r=nearestOnSeg(P,V[j],V[i]);if(r.d<m){m=r.d;mx=r.x;my=r.y;}}
  return {km:m,ref:unproj([mx,my],lat0)};}
 return {km:0,ref:null};}
/* Compass direction the guess sits in, from the nearest point on the
   correct answer — the direction the player overshot toward. */
function bearingDeg(lat1,lon1,lat2,lon2){
 const y=Math.sin(rad(lon2-lon1))*Math.cos(rad(lat2));
 const x=Math.cos(rad(lat1))*Math.sin(rad(lat2))-Math.sin(rad(lat1))*Math.cos(rad(lat2))*Math.cos(rad(lon2-lon1));
 return (Math.atan2(y,x)*180/Math.PI+360)%360;}
const COMPASS=['N','NE','E','SE','S','SW','W','NW'];
const compassOf=deg=>COMPASS[Math.round(deg/45)%8];
const yearsOutside=(y,t)=>Math.max(0,t.start-y,y-t.end);
const decay=(d,l,max)=>Math.round(max*Math.exp(-d/l));

function pickRounds(n){

 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]];}
 const out=[],ch=new Set(),ct=new Set();
 for(const it of pool){if(out.length>=n)break;
  if(ch.has(it.chapter))continue;
  if(ct.has(it.category)&&ct.size<5)continue;
  out.push(it);ch.add(it.chapter);ct.add(it.category);}
 for(const it of pool){if(out.length>=n)break;if(out.indexOf(it)<0)out.push(it);}
 return out.sort(()=>Math.random()-.5);}
