<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Isid. UW - Strata</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/fabrica-components.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <main class="container">
        <p><a href="recreations.html">&larr; Recreations</a></p>
        <div class="exhibit-entry exhibit-page">
            <div class="exhibit-glyph" aria-hidden="true">
                <svg viewBox="0 0 100 100"><rect x="12" y="18" width="76" height="14" fill="none" stroke="#9C4A2B" stroke-width="2.5"/><rect x="12" y="35" width="76" height="14" fill="none" stroke="#9C4A2B" stroke-width="2.5"/><rect x="12" y="52" width="76" height="14" fill="none" stroke="#9C4A2B" stroke-width="2.5"/><rect x="12" y="69" width="76" height="14" fill="none" stroke="#9C4A2B" stroke-width="2.5"/><rect x="42" y="8" width="16" height="16" fill="#9C4A2B" transform="rotate(45 50 16)"/></svg>
            </div>
            <div class="exhibit-details">
                <h1>Strata <span class="status-tag wip">[WIP]</span></h1>
                <p class="exhibit-kind">a where-and-when game</p>
                <p class="exhibit-blurb">Given only a person, place, event, or idea from the ancient world &mdash; no name attached &mdash; drop a pin and set a year, in the style of Anthropeum. 363 rounds drawn from <i>The Story of the World</i>, vol. 1, scored on both place and time at once.</p>
                <div class="exhibit-links">
                    <a href="strata/">Open</a>
                    <a href="about-strata.html">About</a>
                </div>
            </div>
        </div>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        async function loadComponents() {
            const response = await fetch('assets/fabrica-components.html');
            const text = await response.text();
            const parser = new DOMParser();
            const doc = parser.parseFromString(text, 'text/html');

            const headerTemplate = doc.getElementById('site-header');
            document.getElementById('header-placeholder').innerHTML = headerTemplate.innerHTML;

            const footerTemplate = doc.getElementById('site-footer');
            document.getElementById('footer-placeholder').innerHTML = footerTemplate.innerHTML;
        }

        loadComponents();
    </script>
</body>
</html>
